name: Deploy website

# Build the Docusaurus site in website/ and deploy it to Cloudflare Pages
# (project "datafusion-nexus"), served at the apex custom domain
# https://datafusion.nexus. The custom domain + TLS are managed in the
# Cloudflare Pages dashboard, not here. See website/DEPLOY.md.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  - token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID - the Cloudflare account id
# Until those are set, the deploy step fails; the build step still validates.

on:
  # Deploy on pushes to main that touch the site (or this workflow).
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments concurrently.
concurrency:
  group: pages-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # working-directory scopes wrangler to website/ so build/ resolves.
          workingDirectory: website
          command: pages deploy build --project-name=datafusion-nexus --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
