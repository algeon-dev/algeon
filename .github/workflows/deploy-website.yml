name: Deploy website

# A separate workflow from ci.yml: ci.yml serializes runs per ref, so a deploy
# job there would wait for the previous push's native-free checks to finish.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      # `npm run build` checks the numbers in the root README.
      - 'README.md'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read

# Queue deployments instead of cancelling one mid-upload; the last push wins.
concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The environment holds the Cloudflare secrets and only admits main.
    environment:
      name: website
      url: https://algeon.dev
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
