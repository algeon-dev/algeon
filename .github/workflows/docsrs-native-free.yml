name: docs.rs native-free

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    container: rust:1.95-bookworm
    steps:
      - name: Install checkout prerequisites
        run: apt-get update && apt-get install --yes --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
      - name: Build publishable crate documentation without native RAPIDS
        run: bash scripts/ci/check_docsrs_native_free.sh
