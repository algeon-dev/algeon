[workspace]
members = ["cudf-sys", "cudf-rs", "rapids-interop"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/DataFusion-Nexus/cudf-rs"
homepage = "https://github.com/DataFusion-Nexus/cudf-rs"
readme = "README.md"

[workspace.dependencies]
ahash = "0.8"
arrow = "58.3"
bitflags = "2"
cmake = "0.1"
csv = "1.4"
cudf-sys = { path = "cudf-sys", version = "0.2.0" }
indexmap = "2"
parquet = { version = "=58.3", default-features = false }
rapids-interop = { path = "rapids-interop", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1.15"
static_assertions = "1"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3"
tokio = "1"
typed-builder = "0.23"
