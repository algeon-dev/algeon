[workspace]
members = ["cudf-nexus-sys", "cudf-nexus", "rapids-interop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/DataFusion-Nexus/cudf-nexus"
homepage = "https://github.com/DataFusion-Nexus/cudf-nexus"
readme = "README.md"

[workspace.dependencies]
ahash = "0.8"
arrow = { version = "59.2", features = ["ffi"] }
parquet = { version = "=59.2", default-features = false }
bitflags = "2"
cmake = "0.1"
csv = "1.4"
cudf-sys = { package = "cudf-nexus-sys", path = "cudf-nexus-sys", version = "0.1.0" }
indexmap = "2"
rapids-interop = { path = "rapids-interop", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1.15"
static_assertions = "1"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3"
tokio = "1"
typed-builder = "0.23"
