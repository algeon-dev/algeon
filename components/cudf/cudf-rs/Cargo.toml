[package]
name = "cudf"
description = "Safe Rust bindings to libcudf — GPU-accelerated DataFrames"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
arrow = { version = "58", optional = true }
csv = "1.4"
cudf-sys = { path = "../cudf-sys" }
indexmap = "2"

[features]
arrow = ["dep:arrow"]

[dev-dependencies]
static_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
