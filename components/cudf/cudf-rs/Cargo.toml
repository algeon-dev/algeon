[package]
name = "cudf"
description = "Linux-only safe Rust bindings to libcudf — GPU-accelerated DataFrames"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["cuda", "cudf", "dataframe", "gpu", "rapids"]
categories = ["api-bindings", "science"]
autoexamples = false

[[example]]
name = "dual_pipeline_bench"
path = "examples/dual_pipeline_bench.rs"

[[example]]
name = "io_flake_repro"
path = "examples/io_flake_repro.rs"

[[example]]
name = "query_memory_domain_alloc_storm"
path = "examples/query_memory_domain_alloc_storm.rs"

[[example]]
name = "d2h_materialization_bench"
path = "examples/d2h_materialization_bench.rs"

[dependencies]
cudf-sys.workspace = true
rapids-interop.workspace = true
ahash.workspace = true
arrow.workspace = true
bitflags.workspace = true
csv.workspace = true
indexmap.workspace = true
parquet.workspace = true
smallvec.workspace = true
strum.workspace = true
typed-builder.workspace = true


[dev-dependencies]
indexmap = { workspace = true, features = ["serde"] }
parquet = { workspace = true, features = ["arrow"] }
static_assertions.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
