[package]
name = "cudf"
description = "Linux-only safe Rust bindings to libcudf — GPU-accelerated DataFrames"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
strict-multi-gpu = []

[dependencies]
cudf-sys = { path = "../cudf-sys" }
rapids-interop = { path = "../rapids-interop" }
ahash = "0.8"
arrow = { version = "58" }
bitflags = "2"
csv = "1.4"
indexmap = "2"
typed-builder = "0.23"
smallvec = "1.15"


[dev-dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
static_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
