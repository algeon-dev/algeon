[package]
name = "cudf-nexus-sys"
description = "libcudf FFI component for DataFusion Nexus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../../LICENSE"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cudf-nexus-sys"
keywords = ["cuda", "cudf", "ffi", "gpu", "rapids"]
build = "build.rs"
links = "cudf_rust"
autotests = false

[lints]
workspace = true

[lib]
name = "cudf_sys"

[package.metadata.bindgen-cli]
version = "0.72.1"

[features]
default = []
test-hooks = []

[build-dependencies]
cmake.workspace = true

[dev-dependencies]
static_assertions.workspace = true

