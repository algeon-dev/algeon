[package]
name = "algeon-cuml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
description = "Safe Rust bindings to NVIDIA cuML"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/algeon-cuml"
readme = "../README.md"
categories = ["api-bindings", "science"]
keywords = ["cuml", "cuda", "gpu", "rapids"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[lints]
workspace = true

[lib]
name = "cuml"

[dependencies]
cudf.workspace = true
cuml-sys.workspace = true
rapids-interop.workspace = true

[build-dependencies]

[dev-dependencies]
cudf = { workspace = true, features = ["test-hooks"] }
cuml-sys = { workspace = true, features = ["test-hooks"] }
static_assertions.workspace = true
