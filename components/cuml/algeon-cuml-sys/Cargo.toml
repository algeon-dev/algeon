[package]
name = "algeon-cuml-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
links = "cuml_rust"
description = "Low-level FFI bindings to NVIDIA cuML"
license-file = "../../../LICENSE"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/algeon-cuml-sys"
readme = "../README.md"
categories = ["api-bindings", "external-ffi-bindings"]
keywords = ["cuml", "cuda", "ffi", "gpu", "rapids"]
build = "build.rs"

[package.metadata.bindgen-cli]
version = "0.73.2"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[lints]
workspace = true

[lib]
name = "cuml_sys"

[features]
default = []
test-hooks = []

[build-dependencies]
cmake.workspace = true
rapids-build-support.workspace = true

[[test]]
name = "native_abi_contract_gpu"
required-features = ["test-hooks"]
