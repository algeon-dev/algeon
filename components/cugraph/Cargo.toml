[workspace]
members = ["cugraph-sys", "cugraph-rs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94.0"
license = "Apache-2.0"
repository = "https://github.com/morristai/cugraph-rs"
homepage = "https://github.com/morristai/cugraph-rs"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
bindgen = "0.72"
cc = "1.2"
cudf = { path = "../cudf-rs/cudf-rs", version = "0.1.0" }
cudf-sys = { path = "../cudf-rs/cudf-sys", version = "0.1.0" }
rapids-interop = { path = "../cudf-rs/rapids-interop", version = "0.1.0" }
cugraph-sys = { path = "cugraph-sys", version = "0.1.0" }
static_assertions = "1"
