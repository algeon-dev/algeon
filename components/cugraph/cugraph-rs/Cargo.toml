[package]
name = "cugraph"
version = "0.1.0"
edition = "2021"
description = "Safe Rust bindings for NVIDIA cuGraph GPU-accelerated graph analytics"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
cugraph-sys = { path = "../cugraph-sys" }
cudf = { path = "../../cudf-rs/cudf-rs" }

[dev-dependencies]
static_assertions = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
