[package]
name = "cugraph-nexus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Safe Rust bindings for NVIDIA cuGraph GPU-accelerated graph analytics"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
documentation = "https://docs.rs/cugraph-nexus"
categories = ["algorithms", "api-bindings", "science"]
keywords = ["cugraph", "cuda", "gpu", "graph", "rapids"]
build = "build.rs"

[lib]
name = "cugraph"

[features]
test-hooks = ["cudf-sys/test-hooks"]

[dependencies]
cudf.workspace = true
cudf-sys.workspace = true
cugraph-sys.workspace = true
rapids-interop.workspace = true

[dev-dependencies]
anyhow.workspace = true
static_assertions.workspace = true

[build-dependencies]
cc.workspace = true

[[bin]]
name = "allocator_routing_probe"
path = "tests/bin/allocator_routing_probe.rs"
required-features = ["test-hooks"]

[[test]]
name = "cudf_allocator_routing"
path = "tests/cudf_allocator_routing.rs"
required-features = ["test-hooks"]

[[test]]
name = "cudf_prepared"
path = "tests/cudf_prepared.rs"
required-features = ["test-hooks"]

[[test]]
name = "cudf_provenance"
path = "tests/cudf_provenance.rs"
required-features = ["test-hooks"]
