[package]
name = "cugraph-nexus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Safe libcugraph execution component for DataFusion Nexus"
license-file = "../../../LICENSE"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cugraph-nexus"
readme = "../README.md"
keywords = ["cugraph", "cuda", "gpu", "graph", "rapids"]
build = "build.rs"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[lib]
name = "cugraph"

[lints]
workspace = true

[features]
test-hooks = ["cudf-sys/test-hooks"]

[dependencies]
cudf.workspace = true
cudf-sys.workspace = true
cugraph-sys.workspace = true
rapids-interop.workspace = true

[dev-dependencies]
anyhow.workspace = true
static_assertions.workspace = true

[build-dependencies]
cc.workspace = true

[[test]]
name = "cudf_allocator_routing_gpu"
path = "tests/cudf_allocator_routing_gpu.rs"
required-features = ["test-hooks"]

[[test]]
name = "cudf_prepared_gpu"
path = "tests/cudf_prepared_gpu.rs"
required-features = ["test-hooks"]

[[test]]
name = "allocation_failure_sweep_gpu"
path = "tests/allocation_failure_sweep_gpu.rs"
required-features = ["test-hooks"]
