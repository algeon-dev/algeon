[package]
name = "cugraph-nexus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Workspace-internal safe libcugraph execution component for DataFusion Nexus"
license-file = "../../../LICENSE"
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
publish = false
keywords = ["cugraph", "cuda", "gpu", "graph", "rapids"]
build = "build.rs"

[lib]
name = "cugraph"

[lints]
workspace = true

[features]
test-hooks = ["cudf-sys/test-hooks"]

[dependencies]
cudf.workspace = true
cudf-sys.workspace = true
cugraph-sys.workspace = true
rapids-interop.workspace = true

[dev-dependencies]
anyhow.workspace = true
static_assertions.workspace = true

[build-dependencies]
cc.workspace = true

[[test]]
name = "cudf_allocator_routing"
path = "tests/cudf_allocator_routing.rs"
required-features = ["test-hooks"]

[[test]]
name = "cudf_prepared"
path = "tests/cudf_prepared.rs"
required-features = ["test-hooks"]
