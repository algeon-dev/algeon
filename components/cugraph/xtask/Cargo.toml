[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
cudf = { path = "../../cudf-rs/cudf-rs" }
cudf-sys = { path = "../../cudf-rs/cudf-sys" }
cugraph = { path = "../cugraph-rs", package = "cugraph" }
cugraph-sys = { path = "../cugraph-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
