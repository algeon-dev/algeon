[package]
name = "algeon-cuvs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
description = "Algeon-safe Rust bindings for NVIDIA cuVS GPU vector search and clustering"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/algeon-cuvs"
readme = "../README.md"
categories = ["api-bindings", "science"]
keywords = ["cuvs", "cuda", "gpu", "rapids"]
build = "build.rs"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[lints]
workspace = true

[lib]
name = "cuvs"

[dependencies]
cudf.workspace = true
cuvs-sys.workspace = true

[build-dependencies]

[dev-dependencies]
arrow.workspace = true
cudf = { workspace = true, features = ["test-hooks"] }
static_assertions.workspace = true
