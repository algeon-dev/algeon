[workspace]
members = ["cuvs-nexus-sys", "cuvs-nexus", "tools/xtask"]
default-members = ["cuvs-nexus-sys", "cuvs-nexus"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "Apache-2.0"
license-file = "LICENSE"
repository = "https://github.com/DataFusion-Nexus/cuvs-nexus"
homepage = "https://github.com/DataFusion-Nexus/cuvs-nexus"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
arrow = "59.2"
bindgen = "0.72"
cc = "1.2"
cmake-package = "0.2.0"
cudf = { package = "cudf-nexus", path = "../cudf-nexus/cudf-nexus", version = "0.1.0" }
cuvs-sys = { package = "cuvs-nexus-sys", path = "cuvs-nexus-sys", version = "0.1.0" }
rapids-interop = { path = "../cudf-nexus/rapids-interop", version = "0.1.0" }
serde = "1"
serde_json = "1"
static_assertions = "1"
tempfile = "3"
