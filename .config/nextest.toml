test-group = '@global'
# CPU tests take no lock; the longest takes 13s.
slow-timeout = { period = "30s", terminate-after = 4 }

# These execution tests exceeded five seconds in the gate audit. Start them
# early to reduce the final underfilled portion of the shared GPU group.
[[profile.default.overrides]]
filter = '''
binary_id(algeon-query-engine::native_execution_tests_gpu)
& test(/(?x)
    (single_distinct_split_streams_grouped_count_distinct_beside_sum_and_count_within_a_small_grant
    | bounded_native_query_filters_source_chunks_before_frame_only_consumers
    | bounded_native_query_merges_high_cardinality_partials_incrementally_under_the_query_cap
    | bounded_native_query_joins_differently_filtered_scans_of_one_source_without_widening_them
    | bounded_native_query_fails_typed_when_a_shared_leaf_consumer_cannot_shrink_below_the_cap
    | bounded_native_query_reads_a_shared_staged_leaf_once_for_both_join_consumers
    | bounded_native_query_releases_a_shared_leaf_stream_when_cancelled_mid_stream
    | bounded_native_mixed_left_build_preserves_identity_and_finalizes_after_all_probe_batches)$
  /)
'''
priority = 100

[[profile.default.overrides]]
filter = 'all()'
test-group = 'gpu'

[profile.gate]
fail-fast = false
junit.path = "junit.xml"
# A gate's exclusive tests may wait for another run's shared GPU tests to drain.
slow-timeout = { period = "60s", terminate-after = 20 }
global-timeout = "90m"
