# schema: https://nexte.st/schemas/repo-config.json
nextest-version = { required = "0.9.140" }

[profile.default]
# Match the local `cargo test --no-fail-fast` workflow while letting nextest
# schedule independent test cases across CPU cores.
fail-fast = false
slow-timeout = { period = "120s" }
final-status-level = "skip"

[test-groups.gpu]
# Use every CPU core available to the current environment for shared-GPU tests.
# scripts/check_all.sh resolves the same value with `nproc` and passes it
# explicitly through `--test-threads`. The outer GPU lock still serializes this
# lane against other GPU consumers.
max-threads = "num-cpus"

[test-groups.gpu-exclusive]
# Binaries that mutate process-global allocator state or require whole-device
# isolation. This cap serializes them against each other; the generated
# override below adds `threads-required = "num-test-threads"` so they also run
# alone against every other test (including the shared gpu group) in a single
# unfiltered invocation. scripts/check_all.sh additionally serializes the lane
# itself with flock and `--test-threads 1`.
max-threads = 1

