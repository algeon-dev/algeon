# schema: https://nexte.st/schemas/repo-config.json
nextest-version = { required = "0.9.144" }
experimental = ["wrapper-scripts"]

[test-groups]
# The NVIDIA driver serializes CUDA context creation: on one GPU, test
# throughput peaks at 4-8 concurrent processes and falls beyond that.
gpu = { max-threads = 8 }
gpu-exclusive = { max-threads = 1 }

[scripts.wrapper.gpu-lock]
command = { command-line = "scripts/ci/nextest_gpu_lock.sh /tmp/cudf-gpu.lock", relative-to = "workspace-root" }

[profile.default]
fail-fast = { max-fail = 20 }
status-level = "slow"
final-status-level = "slow"
failure-output = "final"
# Applies to GPU tests, whose lock waits count toward it: the longest GPU test
# takes 105s, and a focused run still ends with a summary inside a 10-minute
# agent tool call.
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.scripts]]
filter = 'all()'
run-wrapper = 'gpu-lock'

# A `_gpu_exclusive` target, or tests under a `gpu_exclusive` module inside a
# crate's own unit-test binary, own the device for their whole run.
[[profile.default.overrides]]
filter = 'binary(/_gpu_exclusive$/) | test(/(^|::)gpu_exclusive::/)'
test-group = 'gpu-exclusive'
threads-required = 'num-test-threads'
priority = -100

# CPU is opt-in: a `_cpu` target suffix or an entry below. Everything else runs
# in the gpu group, so a new unlisted target is only slower, never unsafe.
[[profile.default.overrides]]
filter = '''
binary(/_cpu$/)
| binary_id(algeon-cudf-sys) | binary_id(algeon-cugraph-sys) | binary_id(algeon-cuvs-sys) | binary_id(algeon-cuml-sys)
| binary_id(datafusion-facade-consumer) | binary_id(bench) | binary_id(algeon-build-support)
| binary_id(algeon-query-planning)
| binary_id(algeon-interop)
| binary_id(algeon-cudf-sys::build_link_contract) | binary_id(algeon-cudf-sys::fingerprint_matrix_contract)
| binary_id(algeon-datafusion::cpu_contract_tests) | binary_id(algeon-datafusion::native_planning_tests)
| binary_id(algeon-query-engine::native_contract_tests) | binary_id(algeon-query-engine::public_api_boundary)
| binary_id(algeon-server::bin/algeon_server) | binary_id(tools::bin/algeon_tools)
'''
test-group = '@global'
# CPU tests take no lock; the longest takes 13s.
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'all()'
test-group = 'gpu'

[profile.gate]
fail-fast = false
junit.path = "junit.xml"
# A gate's exclusive tests may wait for another run's shared GPU tests to drain.
slow-timeout = { period = "60s", terminate-after = 20 }
global-timeout = "90m"
