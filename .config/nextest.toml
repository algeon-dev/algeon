# schema: https://nexte.st/schemas/repo-config.json
nextest-version = { required = "0.9.140" }

[profile.default]
# Match the local `cargo test --no-fail-fast` workflow while letting nextest
# schedule independent test cases across CPU cores.
fail-fast = false
slow-timeout = { period = "120s" }

[test-groups.gpu]
# Use every CPU core available to the current environment for shared-GPU tests.
# scripts/check_all.sh resolves the same value with `nproc` and passes it
# explicitly through `--test-threads`. The outer GPU lock still serializes this
# lane against other GPU consumers.
max-threads = "num-cpus"

[test-groups.gpu-exclusive]
# Binaries that mutate process-global allocator state or require whole-device
# isolation run in a separate locked invocation after the shared GPU lane. The
# group cap and scripts/check_all.sh both fix their concurrency at one.
max-threads = 1

# .config/policies/test-lanes.toml owns binary admission, reasons, and resource classes.
# This file owns only nextest scheduling mechanics; the override section below
# is generated and byte-for-byte checked by scripts/ci/test_lane_policy.py.
# BEGIN GENERATED TEST-LANE OVERRIDES — scripts/ci/test_lane_policy.py
# Source: .config/policies/test-lanes.toml. Do not edit this section by hand.
# Regenerate: python3 scripts/ci/test_lane_policy.py generate-nextest --write

[[profile.default.overrides]]
filter = '''
(package(datafusion-nexus) & kind(lib))
| (package(datafusion-nexus) & binary(cugraph_tests))
| (package(datafusion-nexus) & binary(iceberg_tests))
| (package(datafusion-nexus) & binary(native_exec_tests))
| (package(datafusion-nexus) & binary(native_metrics_tests))
| (package(datafusion-nexus) & binary(native_runtime_pruning_tests))
| (package(datafusion-nexus) & binary(native_tpcds_parity_tests))
| (package(datafusion-nexus) & binary(server_cugraph_tests))
| (package(datafusion-nexus) & binary(server_tests))
| (package(datafusion-nexus) & binary(session_config_tests))
| (package(nexus-query-engine) & kind(lib))
| (package(nexus-query-engine) & binary(native_execution_tests))
| (package(nexus-query-engine) & binary(native_pipeline_execution_tests))
'''
test-group = "gpu"

[[profile.default.overrides]]
filter = '''
(package(nexus-query-engine) & binary(query_service_allocator_lifecycle))
'''
test-group = "gpu-exclusive"
# END GENERATED TEST-LANE OVERRIDES — scripts/ci/test_lane_policy.py
