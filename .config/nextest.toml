# schema: https://nexte.st/schemas/repo-config.json
experimental = ["wrapper-scripts"]

[test-groups]
# The NVIDIA driver serializes CUDA context creation: on one GPU, test
# throughput peaks at 4-8 concurrent processes and falls beyond that.
gpu = { max-threads = 8 }
gpu-exclusive = { max-threads = 1 }

[scripts.wrapper.gpu-lock]
command = { command-line = "scripts/ci/nextest_gpu_lock.sh /tmp/cudf-gpu.lock", relative-to = "workspace-root" }

[profile.default]
fail-fast = { max-fail = 20 }
status-level = "slow"
final-status-level = "slow"
failure-output = "final"
# Applies to GPU tests, whose lock waits count toward it: the longest GPU test
# takes 105s, and a focused run still ends with a summary inside a 10-minute
# agent tool call.
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.scripts]]
filter = 'all()'
run-wrapper = 'gpu-lock'

# Exclusive targets, gpu_exclusive modules and audited hardware cases own
# the device for their whole run.
[[profile.default.overrides]]
filter = '''
binary(/_gpu_exclusive$/)
| test(/(^|::)gpu_exclusive::/)
| (binary_id(algeon-cudf::interop_contracts_gpu) & test(/::(device_event_export_rejects_readiness_from_another_device|helper_built_exports_reject_cross_device_inputs)$/))
| (binary_id(algeon-query-runtime) & test(/(?x)
    ^runtime::query_service::tests::(multi_device_registry::(query_service_places_concurrent_runtime_handles_on_distinct_devices_when_available
    | alternating_multi_device_stream_cleanup_returns_each_pool_before_reuse
    | escaped_query_anchor_blocks_only_its_selected_device)
    | release_commit::device_local_cleanup_fault_seals_retry_on_a_frozen_eligible_alternate
    | placement::queued_placement_folds_a_native_fault_into_the_ledger_before_retargeting
    | queue::query_admission_waiter_timeout_reports_the_selected_device_requirement)$
  /))
| (binary_id(algeon-cudf) & test(/^runtime::execution_resolver::tests::cross_device_secondary_is_rejected_with_public_classification$/))
| (binary_id(algeon-query-runtime) & test(/^runtime::cache::local_parquet::tests::source_copy_rejects_a_cache_domain_on_another_device$/))
'''
test-group = 'gpu-exclusive'
threads-required = 'num-test-threads'
priority = -100

# CPU is opt-in: a `_cpu` target suffix or an entry below. Everything else runs
