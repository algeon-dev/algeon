# Repository-owned test-lane exception policy.
# Integration test targets declare their execution resource lane directly via target suffixes:
#   - `*_cpu`            : CPU execution lane
#   - `*_gpu`            : Shared GPU execution lane
#   - `*_gpu_exclusive`  : Exclusive GPU execution lane (isolated whole-device)
#
# Only targets that cannot use the suffix convention (library unit test binaries,
# binary targets) and canonical stable development test targets are listed here.

