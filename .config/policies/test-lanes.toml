# Repository-owned lane admission policy. One entry per live pre-merge-admitted
# nextest binary (default-member surface + explicit all-feature bench surface).
# IDs are nextest's complete `binary-id`; lane and GPU resource class are
# reviewed runtime properties.

[[binary]]
id = "datafusion-nexus"
lane = "gpu"
resource_class = "shared"
reason = "Adapter library tests include coverage SQL and native execution context cases that create cuDF runtimes on bounded fixtures."

[[binary]]
id = "nexus-bench"
lane = "cpu"
reason = "Benchmark library unit tests validate workload/report construction; benchmark GPU execution is an explicit cargo-run path."

[[binary]]
id = "nexus-bench::iceberg_bin_tests"
lane = "cpu"
reason = "Tests validate Iceberg CLI item shapes and environment handling without contacting services or CUDA."

[[binary]]
