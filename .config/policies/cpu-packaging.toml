# Repository-owned clean-build and CPU artifact policy.
#
# The canonical Cargo subprocess is launched with env -i semantics. Only
# allowlisted toolchain/location variables enter the build.

[clean_environment]
pass_through = [
  "PATH",
  "HOME",
  "RUSTUP_HOME",
  "CUDA_HOME",
  "CUDA_PATH",
  "LD_LIBRARY_PATH",
  "LIBRARY_PATH",
  "CPATH",
  "C_INCLUDE_PATH",
  "CPLUS_INCLUDE_PATH",
  "PKG_CONFIG_PATH",
  "PKG_CONFIG_LIBDIR",
  "PKG_CONFIG_SYSROOT_DIR",
]
explicit_inputs = [
  "ALGEON_NATIVE_DIR",
]

[clean_environment.fixed_build_environment]
CC = "/usr/bin/gcc-14"
CXX = "/usr/bin/g++-14"
CUDAHOSTCXX = "/usr/bin/g++-14"
AR = "/usr/bin/ar"
CMAKE = "/usr/bin/cmake"
CMAKE_GENERATOR = "Ninja"

[clean_environment.tool_version_commands]
cc = ["/usr/bin/gcc-14", "--version"]
cxx = ["/usr/bin/g++-14", "--version"]
ar = ["/usr/bin/ar", "--version"]
cmake = ["/usr/bin/cmake", "--version"]
ninja = ["/usr/bin/ninja", "--version"]

[cpu]
baseline = "x86-64-v3"
target_triple = "x86_64-unknown-linux-gnu"
rustflags = ["-C", "target-cpu=x86-64-v3"]
cargo_profile = "release"
artifact_dir = "x86-64-v3"
image_arch = "amd64"
deployment_requirement = "The host CPU must implement the full x86-64-v3 ISA; a pre-v3 host may SIGILL before main."

# Cargo features of the shipped `algeon_server` binary. Packaging
# (docker/build-image.sh) and the shipped-clippy phase of
# scripts/check_all.sh both read this list through
# `scripts/build/cpu_packaging_policy.py shipped-features`. NVML device
# diagnostics are opt-in through FEATURES and are not part of this list.
[server]
features = ["cugraph", "cuml", "cuvs", "iceberg"]
