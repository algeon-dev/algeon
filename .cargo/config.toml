# ---------------------------------------------------------------------------
# CPU portability floor for normal GNU x86-64 workspace builds.
#
# Normal GNU x86-64 workspace builds require an x86-64-v2 host. Pinning the
# floor here makes it intentional and uniform across the dependency graph,
# including `ahash` (a cudf-rs dependency).
#
# Why this matters: `ahash` and all Rust/LLVM codegen choose their instruction
# set at COMPILE time from `target_feature`, not at runtime. x86-64-v2 does NOT
# include the `aes` feature, so ahash compiles its portable fallback hasher and
# the binary stays runnable on any v2+ CPU.
#
# This is a host precondition, not a friendly runtime check: code can execute
# before `main`, and the compiler may use v2 instructions in any function. A
# pre-v2 host can therefore fail with SIGILL before the server can print a
# diagnostic.
#
# Redistributable builds do not trust ambient Cargo flags or this developer
# config alone. docker/build.sh uses .config/policies/cpu-packaging.toml and an
# isolated Cargo invocation with the policy's exact target and codegen flags.
#
# Tuned packaging uses the separate `tuned-local-v3` policy profile, artifact
# directory, provenance identity, image tag, and v3 deployment requirement.
# ---------------------------------------------------------------------------
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]
