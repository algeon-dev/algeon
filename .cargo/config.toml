# ---------------------------------------------------------------------------
# CPU portability floor for the redistributable / container build.
#
# We promise a minimum host CPU of x86-64-v2 (SSE4.2 + POPCNT, ~Nehalem 2008+),
# which covers essentially every GPU server. Pinning it here makes the floor
# INTENTIONAL and UNIFORM across the entire dependency graph compiled in this
# workspace — including `ahash` (a cudf-rs dependency).
#
# Why this matters: `ahash` and all Rust/LLVM codegen choose their instruction
# set at COMPILE time from `target_feature`, not at runtime. x86-64-v2 does NOT
# include the `aes` feature, so ahash compiles its portable fallback hasher and
# the binary stays runnable on any v2+ CPU.
#
# NEVER set `target-cpu=native` (or add `+aes`/`+avx512*`) for redistributable
# builds: the build host (Emerald Rapids) has AVX-512 + AES-NI, and baking those
# into unguarded codegen makes the binary SIGILL on older deploy CPUs. The
# server also enforces this floor at startup (see ensure_cpu_baseline()).
#
# Override locally for a CPU-tuned, non-redistributable build, e.g.:
#   RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release
# (RUSTFLAGS fully replaces the flags below; it does not merge.)
# ---------------------------------------------------------------------------
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]
