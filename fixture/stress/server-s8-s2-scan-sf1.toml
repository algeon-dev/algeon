# Server-side companion for stress-s8-flight-{pooled,churn}-sf1.flight-profile.
# It mirrors stress-s2-sweep-scan-sf1's four-device bounded envelope.
[admission]
max_queued_attempts = 64
max_queue_wait_ms = 30000

[[admission.device_profiles]]
