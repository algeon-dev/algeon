memory_limit_bytes = 47244640256
backend_reserve_bytes = 1073741824
cache_cap_bytes = 0
default_query_limit_bytes = 268435456
source_work_per_attempt = 2
max_active_attempts = 2
stream_pool_size = 6
worker_count = 4
lane_count = 4

