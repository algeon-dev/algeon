[package]
name = "bench"
description = "Benchmark, report, triage, and stress binaries for algeon-datafusion."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
build = "build.rs"
publish = false
autobins = false
autotests = false

[lints]
workspace = true

[features]
default = []
cugraph = [
  "algeon-datafusion/cugraph",
  "dep:cugraph",
  "dep:cugraph-sys",
]
cuvs = [
  "algeon-datafusion/cuvs",
  "dep:cuvs-sys",
]
cuml = ["algeon-datafusion/cuml", "dep:cuml-sys"]

[dependencies]
algeon-datafusion = { workspace = true, features = ["bench-support", "nvml"] }
workloads = { workspace = true }
query-engine = { workspace = true }
query-planning = { workspace = true }
query-runtime = { workspace = true }
datafusion = { workspace = true }
arrow = { workspace = true }
parquet = { workspace = true }
cudf = { workspace = true }
# Direct (non-transitive) dep on cudf-sys so THIS crate's build.rs receives
# DEP_CUDF_RUST_RUNTIME_LIB_DIR from cudf-sys's `links = "cudf_rust"` metadata,
# mirroring the DataFusion adapter crate's rpath bake.
cudf-sys = { workspace = true }
cugraph = { workspace = true, optional = true }
cugraph-sys = { workspace = true, optional = true }
cuvs-sys = { workspace = true, optional = true }
cuml-sys = { workspace = true, optional = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "signal", "sync", "time"] }

[lib]
name = "bench"
path = "src/lib.rs"

[[bin]]
name = "cugraph_sql_construction_report"
required-features = ["cugraph"]
test = false

[[bin]]
name = "cugraph_admission_stress"
required-features = ["cugraph"]
test = false

[[bin]]
name = "forest_predict"
required-features = ["cuml"]
test = false

# Report/stress/bench binaries keep useful unit tests in the package lib harness.
# They remain normal build/clippy targets, but do not create nextest bin harnesses.
[[bin]]
name = "native_clickbench_benchmark"
test = false

[[bin]]
name = "native_clickbench_execution_report"
test = false

[[bin]]
name = "native_datafusion_planning_report"
test = false

[[bin]]
name = "native_fallback_pressure_report"
test = false

[[bin]]
name = "native_tpcds_execution_report"
test = false

[[bin]]
name = "native_tpcds_parity_report"
test = false

[[bin]]
name = "native_tpch_benchmark"
test = false

[[bin]]
name = "native_tpch_execution_report"
test = false

[[bin]]
name = "query_service_goodput"
test = false

[[bin]]
name = "tpcds_gpu_cpu_bench"
test = false

[[bin]]
name = "sort_lane_sweep"
test = false

[build-dependencies]
rapids-build-support = { workspace = true }

[[test]]
name = "clickbench_workload_tests_cpu"
