[package]
name = "examples"
description = "Small, self-contained Algeon SQL examples."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
build = "build.rs"
publish = false
default-run = "query_parquet"

[lints]
workspace = true

[features]
default = []
cugraph = ["dep:cugraph-sys", "algeon-datafusion/cugraph"]
cuvs = ["dep:cuvs-sys", "algeon-datafusion/cuvs"]

[dependencies]
algeon-datafusion = { workspace = true }
anyhow = { workspace = true }
arrow = { workspace = true }
cudf-sys = { workspace = true }
cugraph-sys = { workspace = true, optional = true }
cuvs-sys = { workspace = true, optional = true }
datafusion = { workspace = true }
futures = { workspace = true }
parquet = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# These programs are verified by running them; they carry no unit-test harness.
[[bin]]
name = "query_parquet"
path = "src/bin/query_parquet.rs"
test = false

[[bin]]
name = "graph_pagerank"
path = "src/bin/graph_pagerank.rs"
required-features = ["cugraph"]
test = false

[[bin]]
name = "vector_search"
path = "src/bin/vector_search.rs"
required-features = ["cuvs"]
test = false

[build-dependencies]
rapids-build-support = { workspace = true }
