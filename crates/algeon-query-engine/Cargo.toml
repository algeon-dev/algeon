[package]
name = "algeon-query-engine"
description = "Native cuDF/cuGraph query engine contracts for DataFusion-free GPU plans."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/algeon-query-engine"
readme = "../../README.md"
keywords = ["datafusion", "gpu", "cuda", "cudf", "rapids"]
categories = ["database", "hardware-support"]
build = "build.rs"
# The native-execution fixture is compiled as a crate unit-test module so its
# synthetic admission hooks never need a caller-enableable public feature.
autotests = false

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
features = ["cugraph", "cuvs", "nvml"]

# The package carries the `algeon-` prefix for crates.io; the library identity
# stays bare so `use query_engine::…` and the public API snapshots do not move.
[lib]
name = "query_engine"

[features]
default = []
cugraph = ["dep:cugraph", "dep:cugraph-sys", "query-runtime/cugraph"]
cuvs = ["dep:cuvs", "dep:cuvs-sys"]
# Optional live NVML diagnostics; admission capacity and SM count remain on cudf CUDA/RMM inventory.
nvml = ["query-runtime/nvml"]
# Forwards the controlled device-quarantine qualification capability the DataFusion adapter exposes.
qualification = ["query-runtime/qualification"]
# Enables the test seams consumed by registered GPU execution harnesses.
test-hooks = ["query-planning/test-hooks", "query-runtime/test-hooks", "cudf-sys/test-hooks", "cugraph?/test-hooks"]

[lints]
workspace = true

[dependencies]
arrow = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
cudf = { workspace = true }
# Direct edge so build.rs receives both the runtime directory and the shared
# RMM/logger identity exported through cudf-sys's DEP_CUDF_RUST_* metadata.
cudf-sys = { workspace = true }
cugraph = { workspace = true, optional = true }
cugraph-sys = { workspace = true, optional = true }
cuvs = { workspace = true, optional = true }
cuvs-sys = { workspace = true, optional = true }
fnv = { workspace = true }
futures = { workspace = true }
query-planning = { workspace = true }
query-runtime = { workspace = true }
object_store = { workspace = true }
parquet = { workspace = true, features = ["arrow"] }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
rapids-build-support = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
query-planning = { workspace = true, features = ["test-hooks"] }
query-runtime = { workspace = true, features = ["test-hooks"] }

# autotests = false above: every tests/*.rs harness must be registered here
# explicitly: unregistered files are silently ignored by cargo.
[[test]]
name = "gpu_backend_shared_tests_gpu"
path = "tests/gpu_backend_shared_tests_gpu.rs"

[[test]]
name = "gpu_allocator_event_correlation_gpu_exclusive"
path = "tests/gpu_allocator_event_correlation_gpu_exclusive.rs"

[[test]]
name = "query_service_allocator_lifecycle_gpu"
path = "tests/query_service_allocator_lifecycle_gpu.rs"

[[test]]
name = "native_contract_tests"
path = "tests/native_contract_tests.rs"

[[test]]
name = "native_execution_tests_gpu"
path = "tests/native_execution_tests_gpu.rs"
required-features = ["test-hooks"]

[[test]]
name = "native_pipeline_execution_tests_gpu"
path = "tests/native_pipeline_execution_tests_gpu.rs"
required-features = ["test-hooks"]

[[test]]
name = "native_lane_parallel_execution_tests_gpu_exclusive"
path = "tests/native_lane_parallel_execution_tests_gpu_exclusive.rs"
required-features = ["test-hooks"]

[[test]]
name = "runtime_execution_integration_tests_gpu"
path = "src/execution_integration_tests/gpu_resident.rs"
required-features = ["cugraph", "test-hooks"]

[[test]]
name = "public_api_boundary"
path = "tests/public_api_boundary.rs"
