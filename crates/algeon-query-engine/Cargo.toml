[package]
name = "algeon-query-engine"
description = "Native cuDF/cuGraph query engine contracts for GPU plans."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/algeon-query-engine"
readme = "README.md"
keywords = ["datafusion", "gpu", "cuda", "cudf", "rapids"]
categories = ["database", "hardware-support"]
build = "build.rs"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
features = ["cugraph", "cuvs", "cuml", "nvml"]

# The package carries the `algeon-` prefix for crates.io; the library identity
# stays bare so `use query_engine::…` and the public API snapshots do not move.
[lib]
name = "query_engine"

[features]
default = []
cugraph = ["dep:cugraph", "dep:cugraph-sys", "query-runtime/cugraph"]
cuvs = ["dep:cuvs", "dep:cuvs-sys"]
cuml = ["dep:cuml", "dep:cuml-sys"]
# Optional live NVML diagnostics; admission capacity and SM count remain on cudf CUDA/RMM inventory.
nvml = ["query-runtime/nvml"]
# Forwards the controlled device-quarantine qualification capability the DataFusion adapter exposes.
qualification = ["query-runtime/qualification"]
# Enables the test seams consumed by registered GPU execution harnesses.
test-hooks = ["query-planning/test-hooks", "query-runtime/test-hooks", "cugraph?/test-hooks"]

[lints]
workspace = true

[dependencies]
arrow = { workspace = true }
bytes = { workspace = true }
cudf = { workspace = true }
# Direct edge so build.rs receives both the runtime directory and the shared
# RMM/logger identity exported through cudf-sys's DEP_CUDF_RUST_* metadata.
cudf-sys = { workspace = true }
cugraph = { workspace = true, optional = true }
cugraph-sys = { workspace = true, optional = true }
cuvs = { workspace = true, optional = true }
cuvs-sys = { workspace = true, optional = true }
cuml = { workspace = true, optional = true }
cuml-sys = { workspace = true, optional = true }
futures = { workspace = true }
query-planning = { workspace = true }
query-runtime = { workspace = true }
object_store = { workspace = true }
parquet = { workspace = true, features = ["arrow"] }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
rapids-build-support = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
cudf = { workspace = true, features = ["test-hooks"] }
query-planning = { workspace = true, features = ["test-hooks"] }
query-runtime = { workspace = true, features = ["test-hooks"] }

[[test]]
name = "native_contract_tests_cpu"
required-features = ["test-hooks"]

[[test]]
name = "native_execution_tests_gpu"
required-features = ["test-hooks"]

[[test]]
name = "runtime_execution_integration_tests_gpu"
required-features = ["test-hooks"]
