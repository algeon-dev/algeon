[package]
name = "nexus-query-planning"
description = "DataFusion-free native query planning, proof, and admission contracts."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nexus-query-planning"
readme = "../../README.md"
keywords = ["datafusion", "gpu", "cuda", "query-planning", "rapids"]
categories = ["database"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
features = ["cugraph", "cuvs"]

[features]
default = []
cugraph = ["dep:cugraph"]
cuvs = ["dep:cuvs"]
test-hooks = []

[lints]
workspace = true

[dependencies]
arrow = { workspace = true }
blake3 = { workspace = true }
cudf = { workspace = true }
cugraph = { workspace = true, optional = true }
cuvs = { workspace = true, optional = true }
fnv = { workspace = true }
parquet = { workspace = true, features = ["arrow"] }
serde = { workspace = true }
serde_json = { workspace = true }
