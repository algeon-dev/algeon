[package]
name = "algeon-server"
description = "Standalone Arrow Flight SQL server binary for algeon-datafusion."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
license.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
build = "build.rs"

[features]
default = []
cugraph = ["algeon-datafusion/cugraph", "dep:cugraph-sys"]
cuvs = ["algeon-datafusion/cuvs", "dep:cuvs-sys"]
cuml = ["algeon-datafusion/cuml", "dep:cuml-sys"]
nvml = ["algeon-datafusion/nvml"]

[lints]
workspace = true

[dependencies]
algeon-datafusion = { workspace = true, default-features = false, features = ["server"] }
# Keep these direct sys edges so build.rs receives runtime link metadata.
cudf-sys = { workspace = true }
cugraph-sys = { workspace = true, optional = true }
cuvs-sys = { workspace = true, optional = true }
cuml-sys = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
rapids-build-support = { workspace = true }

[[bin]]
name = "algeon_server"
