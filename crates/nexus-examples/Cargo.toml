[package]
name = "nexus-examples"
description = "Runnable embedding examples for datafusion-nexus."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
publish = false
default-run = "embedded_backend"

[lints]
workspace = true

[features]
default = []
cuvs = ["dep:cuvs-sys", "datafusion-nexus/server-cuvs", "nexus-query-engine/cuvs"]
# The reference OTLP exporter is deliberately opt-in: it adds a tonic transport
# stack that ordinary embedding examples do not need.
otlp-metrics = [
  "dep:opentelemetry",
  "dep:opentelemetry-proto",
]

[dependencies]
anyhow = { workspace = true }
arrow = { workspace = true }
arrow-json = { workspace = true }
axum = { workspace = true }
cudf-sys = { workspace = true }
cugraph-sys = { workspace = true }
cuvs-sys = { workspace = true, optional = true }
datafusion = { workspace = true }
futures = { workspace = true }
datafusion-nexus = { workspace = true, features = ["server-cugraph", "iceberg"] }
nexus-query-engine = { workspace = true }
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics"], optional = true }
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic-messages", "metrics", "gen-tonic"], optional = true }
parquet = { workspace = true }
tempfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lib]
name = "nexus_examples"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "embedded_backend"
path = "src/bin/embedded_backend.rs"
test = false

[[bin]]
name = "otlp_metrics_exporter"
path = "src/bin/otlp_metrics_exporter.rs"
test = false
required-features = ["otlp-metrics"]

[[test]]
name = "otlp_metrics_exporter"
path = "tests/otlp_metrics_exporter.rs"
required-features = ["otlp-metrics"]
