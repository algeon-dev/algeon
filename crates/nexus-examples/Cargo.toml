[package]
name = "nexus-examples"
description = "Runnable embedding examples for datafusion-nexus."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
publish = false
default-run = "embedded_backend"

[lints]
workspace = true

[features]
default = []
cuvs = ["dep:cuvs-sys", "datafusion-nexus/server-cuvs", "nexus-query-engine/cuvs"]

[dependencies]
anyhow = { workspace = true }
arrow = { workspace = true }
arrow-json = { workspace = true }
axum = { workspace = true }
cudf-sys = { workspace = true }
cugraph-sys = { workspace = true }
cuvs-sys = { workspace = true, optional = true }
datafusion = { workspace = true }
futures = { workspace = true }
datafusion-nexus = { workspace = true, features = ["server-cugraph", "iceberg"] }
nexus-query-engine = { workspace = true }
parquet = { workspace = true }
tempfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lib]
name = "nexus_examples"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "embedded_backend"
path = "src/bin/embedded_backend.rs"
test = false
