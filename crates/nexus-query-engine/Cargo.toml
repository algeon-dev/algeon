[package]
name = "nexus-query-engine"
description = "Native cuDF/cuGraph query engine contracts for DataFusion-free GPU plans."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
build = "build.rs"

[features]
default = []
cugraph = ["dep:cugraph", "dep:cugraph-sys"]

[lints]
workspace = true

[dependencies]
arrow = { workspace = true }
bytes = "1"
cudf = { workspace = true }
cugraph = { workspace = true, optional = true }
cugraph-sys = { workspace = true, optional = true }
futures = { workspace = true }
nvml-wrapper = "0.12.1"
object_store = { workspace = true }
parquet = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
