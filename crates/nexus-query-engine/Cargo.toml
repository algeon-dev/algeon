[package]
name = "nexus-query-engine"
description = "Native cuDF/cuGraph query engine contracts for DataFusion-free GPU plans."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
build = "build.rs"
# The native-execution fixture is compiled as a crate unit-test module so its
# synthetic admission hooks never need a caller-enableable public feature.
autotests = false

[features]
default = []
cugraph = ["dep:cugraph", "dep:cugraph-sys", "nexus-query-planning/cugraph", "nexus-query-runtime/cugraph"]
cuvs = ["dep:cuvs", "dep:cuvs-sys", "nexus-query-planning/cuvs", "nexus-query-runtime/cuvs"]
# Optional live NVML diagnostics; admission capacity and SM count remain on cudf CUDA/RMM inventory.
nvml = ["nexus-query-runtime/nvml"]
# Enables the crate-private seams consumed by the registered GPU execution harness.
test-hooks = ["nexus-query-planning/test-hooks", "nexus-query-runtime/test-hooks"]

[lints]
workspace = true

[dependencies]
arrow = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
cudf = { workspace = true }
# Direct edge so build.rs receives both the runtime directory and the shared
# RMM/logger identity exported through cudf-sys's DEP_CUDF_RUST_* metadata.
cudf-sys = { workspace = true }
cugraph = { workspace = true, optional = true }
cugraph-sys = { workspace = true, optional = true }
cuvs = { workspace = true, optional = true }
cuvs-sys = { workspace = true, optional = true }
futures = { workspace = true }
nexus-query-planning = { workspace = true }
nexus-query-runtime = { workspace = true }
object_store = { workspace = true }
parquet = { workspace = true, features = ["arrow"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
async-trait = { workspace = true }

# autotests = false above: every tests/*.rs harness must be registered here
# explicitly — unregistered files are silently ignored by cargo.
[[test]]
name = "gpu_backend_shared_tests"
path = "tests/gpu_backend_shared_tests.rs"

[[test]]
name = "gpu_allocator_exclusive_tests"
path = "tests/gpu_allocator_exclusive_tests.rs"

[[test]]
name = "native_contract_tests"
path = "tests/native_contract_tests.rs"

[[test]]
name = "native_execution_tests"
path = "tests/native_execution_tests.rs"
required-features = ["test-hooks"]

[[test]]
name = "native_pipeline_execution_tests"
path = "tests/native_pipeline_execution_tests.rs"

[[test]]
name = "runtime_execution_integration_tests"
path = "src/execution_integration_tests/gpu_resident.rs"
required-features = ["cugraph", "test-hooks"]

[[test]]
name = "public_api_boundary"
path = "tests/public_api_boundary.rs"
