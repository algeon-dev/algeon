[package]
name = "datafusion-nexus-bench"
description = "Benchmark, report, triage, and stress binaries for datafusion-nexus."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
build = "build.rs"
publish = false

[lints]
workspace = true

[features]
default = []
iceberg = [
  "datafusion-nexus/iceberg",
  "dep:aws-config",
  "dep:aws-credential-types",
  "dep:iceberg",
  "dep:object_store",
  "dep:tempfile",
]
cugraph = [
  "datafusion-nexus/cugraph",
  "nexus-query-engine/cugraph",
  "dep:cugraph",
  "dep:cugraph-sys",
]

[dependencies]
datafusion-nexus = { workspace = true }
datafusion-nexus-workloads = { workspace = true }
nexus-query-engine = { workspace = true }
datafusion = { workspace = true }
arrow = { workspace = true }
async-trait = "0.1"
parquet = { workspace = true }
cudf = { workspace = true }
# Direct (non-transitive) dep on cudf-sys so THIS crate's build.rs receives
# DEP_CUDF_RUST_RUNTIME_LIB_DIR from cudf-sys's `links = "cudf_rust"` metadata,
# mirroring the root crate's rpath bake.
cudf-sys = { workspace = true }
cugraph = { workspace = true, optional = true }
cugraph-sys = { workspace = true, optional = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "signal", "sync", "time"] }
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
iceberg = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[lib]
name = "datafusion_nexus_bench"
path = "src/lib.rs"

[[bin]]
name = "native_iceberg_tpch_benchmark"
required-features = ["iceberg"]
test = false

[[bin]]
name = "native_iceberg_smoke_report"
required-features = ["iceberg"]
test = false

[[bin]]
name = "query_service_iceberg_stress"
required-features = ["iceberg"]
test = false

[[bin]]
name = "cugraph_sql_construction_report"
required-features = ["cugraph"]
test = false

[[bin]]
name = "cugraph_admission_stress"
required-features = ["cugraph"]
test = false

# Report/stress/bench binaries keep useful unit tests in the package lib harness.
# They remain normal build/clippy targets, but do not create nextest bin harnesses.
[[bin]]
name = "native_clickbench_benchmark"
test = false

[[bin]]
name = "native_clickbench_execution_report"
test = false

[[bin]]
name = "native_datafusion_planning_report"
test = false


[[bin]]
name = "native_fallback_pressure_report"
test = false


[[bin]]
name = "native_tpcds_execution_report"
test = false

[[bin]]
name = "native_tpcds_parity_report"
test = false

[[bin]]
name = "native_tpch_benchmark"
test = false

[[bin]]
name = "native_tpch_execution_report"
test = false

[[bin]]
name = "query_service_tpcds_stress"
test = false

[[bin]]
name = "query_service_tpch_stress"
test = false

[[bin]]
name = "tpcds_three_way_bench"
test = false

[[test]]
name = "iceberg_bin_tests"
required-features = ["iceberg"]
