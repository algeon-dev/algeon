[package]
name = "nexus-query-runtime"
description = "DataFusion-free native query runtime, lifecycle, ledger, and observation owners."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nexus-query-runtime"
readme = "../../README.md"
keywords = ["datafusion", "gpu", "cuda", "runtime", "rapids"]
categories = ["database"]

[features]
default = []
cugraph = ["dep:cugraph", "nexus-query-planning/cugraph"]
cuvs = ["nexus-query-planning/cuvs"]
nvml = ["dep:nvml-wrapper"]
# Controlled device-quarantine qualification: closes admission on one live
# device ledger through the same gate placement uses. No generic fault API.
qualification = []
test-hooks = ["nexus-query-planning/test-hooks"]

[lints]
workspace = true

[dependencies]
arrow = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
cudf = { workspace = true }
cugraph = { workspace = true, optional = true }
fnv = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
nexus-query-planning = { workspace = true }
nvml-wrapper = { version = "0.12.1", optional = true }
object_store = { workspace = true }
parquet = { workspace = true, features = ["arrow"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
async-trait = { workspace = true }
cudf-sys = { workspace = true, features = ["test-hooks"] }
