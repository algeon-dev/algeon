[package]
name = "datafusion-nexus-tools"
description = "Developer, operator, and explicit E2E tools for datafusion-nexus."
version = "0.1.0"
edition = "2024"
rust-version = { workspace = true }
publish = false
default-run = "datafusion_nexus_tools"

[lints]
workspace = true

[features]
default = []
cugraph-oracle = ["dep:datafusion-nexus", "datafusion-nexus/cugraph"]
iceberg-e2e = [
  "dep:datafusion",
  "dep:datafusion-nexus",
  "dep:iceberg",
  "dep:iceberg-catalog-glue",
  "datafusion-nexus/iceberg-cpu",
]
server-iceberg-e2e = ["iceberg-e2e", "datafusion-nexus/server"]

[dependencies]
arrow = { workspace = true }
arrow-flight = { version = "58.3", features = ["flight-sql-experimental"] }
datafusion = { version = "53.1", optional = true }
datafusion-nexus = { path = "../..", default-features = false, optional = true }
futures = "0.3"
iceberg = { git = "https://github.com/apache/iceberg-rust.git", rev = "d32c234", optional = true }
iceberg-catalog-glue = { git = "https://github.com/apache/iceberg-rust.git", rev = "d32c234", optional = true }
parquet = { workspace = true }
serde_json = "1.0"
tokio = { version = "1.52", features = ["macros", "rt", "rt-multi-thread", "time"] }
tonic = "0.14"
url = "2.5"

[[bin]]
name = "datafusion_nexus_tools"
path = "src/bin/datafusion_nexus_tools.rs"
test = false

[[bin]]
name = "refresh_cugraph_oracle"
path = "src/bin/refresh_cugraph_oracle.rs"
required-features = ["cugraph-oracle"]
test = false
