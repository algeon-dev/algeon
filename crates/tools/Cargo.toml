[package]
name = "tools"
description = "Developer, operator, and explicit E2E tools for algeon-datafusion."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
publish = false
default-run = "algeon_tools"
build = "build.rs"

[lints]
workspace = true

[features]
default = []
validate-query = ["dep:datafusion", "dep:algeon-datafusion"]
datafusion-baseline-contract-validate = [
  "dep:cudf",
  "dep:datafusion",
  "dep:algeon-datafusion",
  "dep:query-engine",
  "algeon-datafusion/bench-support",
]
clickbench-stage-probe = [
  "dep:cudf",
  "dep:datafusion",
  "dep:algeon-datafusion",
  "dep:bench",
  "dep:workloads",
  "dep:query-engine",
  "dep:query-planning",
  "dep:query-runtime",
  "algeon-datafusion/bench-support",
]
shadow-estimate-report = [
  "dep:cudf",
  # Direct dep so this crate's build.rs bakes the native rpath; without it the
  # tool binary cannot find libcudf.so at run time.
  "dep:cudf-sys",
  "dep:datafusion",
  "dep:algeon-datafusion",
  "dep:bench",
  "dep:workloads",
  "dep:query-engine",
  "dep:query-planning",
  "dep:query-runtime",
  "algeon-datafusion/bench-support",
]
cugraph-oracle = [
  "dep:cudf",
  # The PageRank acceptance command checks host Arrow transfer counts.
  "cudf/test-hooks",
  "dep:datafusion",
  "dep:algeon-datafusion",
  "algeon-datafusion/cugraph",
  "algeon-datafusion/bench-support",
]
# flight-sql-stress result checking with the TPC-DS parity comparator. The
# base stress client stays CPU-only; this feature links cuDF through
# algeon-datafusion, and cudf-sys is direct so build.rs bakes the native rpath.
flight-sql-stress-check = ["dep:algeon-datafusion", "dep:cudf-sys", "algeon-datafusion/bench-support"]
# Explicit black-box E2E runners; each drives a child process over the network.
# The runtime-observability runner reads only the runtime's JSONL schema
# constant, to validate retained artifacts.
server-runtime-observability-e2e = ["dep:query-runtime"]
embedded-backend-e2e = ["dep:reqwest"]
# `s3://` Parquet scans through one S3 configuration for DataFusion and native
# reads, for a library and a server-configured backend, against real S3 or an
# S3-compatible service.
s3-parquet-e2e = ["dep:cudf-sys", "dep:datafusion", "dep:algeon-datafusion", "algeon-datafusion/server"]
# Iceberg REST and Glue catalogs served by an in-process Flight SQL server,
# against the local services of fixtures/iceberg-local.
iceberg-local-e2e = [
  "dep:cudf-sys", "dep:datafusion", "dep:algeon-datafusion", "algeon-datafusion/server",
  "dep:algeon-iceberg", "dep:iceberg", "dep:tokio-util",
]
embedded-backend-fixture = [
  "dep:algeon-datafusion", "algeon-datafusion/server", "algeon-datafusion/cugraph",
  "dep:cudf-sys", "dep:cugraph-sys", "dep:datafusion", "dep:anyhow",
  "dep:arrow-json", "dep:axum", "dep:tokio-util", "dep:tracing", "dep:tracing-subscriber",
  "tokio/signal",
]
attempt-lifecycle-probe = ["dep:algeon-datafusion", "dep:cudf-sys", "dep:datafusion", "dep:anyhow", "dep:tempfile"]
otlp-metrics = ["dep:algeon-datafusion", "dep:cudf-sys", "dep:anyhow", "dep:opentelemetry", "dep:opentelemetry-proto"]
# The production-validation runner is intentionally opt-in. The base feature
# stays CPU-only so profile parsing, arrival planning, aggregation, and artifact
# writing are unit-testable without CUDA.
single-node-multi-gpu-validate = ["dep:workloads"]
# Measured execution on the public backend and attempt API.
single-node-multi-gpu-validate-run = [
  "single-node-multi-gpu-validate",
  "dep:cudf",
  "dep:cudf-sys",
  "dep:cuvs-sys",
  "dep:cuml-sys",
  "dep:datafusion",
  "dep:algeon-datafusion",
  "dep:query-planning",
  "dep:query-runtime",
  "algeon-datafusion/qualification",
]
# Optional NVML device diagnostics (model, UUID, physical framebuffer and
# utilization samples). Weak forwarding enables NVML only on backends another
# selected feature already pulls in.
nvml = ["algeon-datafusion?/nvml", "bench?/nvml"]
# The base run feature intentionally keeps `cugraph` off. It is the required
# feature-off service cell, where graph UDTFs must reject structurally while the
# relational load continues. Graph qualification opts in explicitly.
single-node-multi-gpu-validate-run-cugraph = [
  "single-node-multi-gpu-validate-run",
  "dep:cugraph-sys",
  "algeon-datafusion/cugraph",
]
# Retain the graph-enabled OTLP validation cell independently of the examples.
single-node-multi-gpu-validate-run-otlp = [
  "single-node-multi-gpu-validate-run-cugraph",
  "otlp-metrics",
]

[dependencies]
anyhow = { workspace = true, optional = true }
arrow-json = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
arrow = { workspace = true }
arrow-flight = { workspace = true }
cudf = { workspace = true, optional = true }
# Direct (non-transitive) dep so THIS crate's build.rs receives
# DEP_CUDF_RUST_RUNTIME_LIB_DIR from cudf-sys's `links = "cudf_rust"` metadata,
# mirroring the root, bench, engine, and examples rpath bake.
cudf-sys = { workspace = true, optional = true }
cugraph-sys = { workspace = true, optional = true }
cuvs-sys = { workspace = true, optional = true }
cuml-sys = { workspace = true, optional = true }
datafusion = { workspace = true, optional = true }
algeon-datafusion = { workspace = true, optional = true }
algeon-iceberg = { workspace = true, optional = true }
bench = { path = "../bench", optional = true }
workloads = { workspace = true, optional = true }
query-engine = { workspace = true, optional = true }
query-planning = { workspace = true, optional = true }
query-runtime = { workspace = true, optional = true }
futures = { workspace = true }
iceberg = { workspace = true, optional = true }
parquet = { workspace = true, features = ["arrow"] }
opentelemetry = { workspace = true, optional = true }
opentelemetry-proto = { workspace = true, optional = true }
prost = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tempfile = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tonic = { workspace = true }
url = "2.5"

[lib]
test = false
doctest = false

[[bin]]
name = "embedded_backend"
path = "src/bin/embedded_backend.rs"
required-features = ["embedded-backend-fixture"]
test = false

[[bin]]
name = "attempt_lifecycle"
path = "src/bin/attempt_lifecycle.rs"
required-features = ["attempt-lifecycle-probe"]
test = false

[[test]]
name = "otlp_metrics_exporter_cpu"
required-features = ["otlp-metrics"]

[[bin]]
name = "algeon_tools"
path = "src/main.rs"
test = true

[[bin]]
name = "refresh_cugraph_oracle"
path = "src/bin/refresh_cugraph_oracle.rs"
required-features = ["cugraph-oracle"]
test = false

[dev-dependencies]
# Paused-clock tests drive the open-loop scheduler and the admission sampler.
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
rapids-build-support = { workspace = true }
