[package]
name = "tools"
description = "Developer, operator, and explicit E2E tools for algeon-datafusion."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
publish = false
default-run = "algeon_tools"
build = "build.rs"

[lints]
workspace = true

[features]
default = []
validate-query = ["dep:datafusion", "dep:algeon-datafusion"]
datafusion-baseline-contract-validate = [
  "dep:cudf",
  "dep:datafusion",
  "dep:algeon-datafusion",
  "dep:query-engine",
  "algeon-datafusion/bench-support",
]
clickbench-stage-probe = [
  "dep:cudf",
  "dep:datafusion",
  "dep:algeon-datafusion",
  "dep:bench",
  "dep:workloads",
  "dep:query-engine",
  "dep:query-planning",
  "dep:query-runtime",
  "algeon-datafusion/bench-support",
]
shadow-estimate-report = [
  "dep:cudf",
  # Direct dep so this crate's build.rs bakes the native rpath; without it the
  # tool binary cannot find libcudf.so at run time.
  "dep:cudf-sys",
  "dep:datafusion",
  "dep:algeon-datafusion",
  "dep:bench",
  "dep:workloads",
  "dep:query-engine",
  "dep:query-planning",
  "dep:query-runtime",
  "algeon-datafusion/bench-support",
]
cugraph-oracle = [
  "dep:cudf",
  # The path-included cuGraph SQL fixtures read cudf's host Arrow call counters
  # (`cudf::testing::arrow`).
  "cudf/test-hooks",
  "dep:datafusion",
  "dep:algeon-datafusion",
  "dep:query-engine",
  "dep:query-planning",
  "dep:query-runtime",
  "algeon-datafusion/cugraph",
  "algeon-datafusion/bench-support",
]
# Explicit black-box E2E runners; each drives a child process over the network.
# The runtime-observability runner reads only the runtime's JSONL schema
# constant, to validate retained artifacts.
server-runtime-observability-e2e = ["dep:query-runtime"]
embedded-backend-e2e = ["dep:reqwest"]
# One S3 configuration serving DataFusion and native reads, for a library and a
# server-configured backend, against an external S3-compatible service.
s3-parquet-e2e = ["dep:cudf-sys", "dep:datafusion", "dep:algeon-datafusion", "algeon-datafusion/server"]
# The production-validation runner is intentionally opt-in. The base feature
# stays CPU-only so profile parsing, arrival planning, aggregation, and artifact
# writing are unit-testable without CUDA.
single-node-multi-gpu-validate = ["dep:workloads"]
# Measured execution on the public backend and attempt API.
single-node-multi-gpu-validate-run = [
  "single-node-multi-gpu-validate",
  "dep:cudf",
  "dep:cudf-sys",
  "dep:cuvs-sys",
  "dep:cuml-sys",
  "dep:datafusion",
  "dep:algeon-datafusion",
  "dep:query-planning",
  "dep:query-runtime",
  "algeon-datafusion/qualification",
  # Device identity (model name, UUID, physical framebuffer) comes from NVML,
  # and the artifact contract requires recording it.
  "algeon-datafusion/nvml",
]
# The base run feature intentionally keeps `cugraph` off. It is the required
# feature-off service cell: graph UDTFs must reject structurally while the
# relational load continues. Graph qualification opts in explicitly.
single-node-multi-gpu-validate-run-cugraph = [
  "single-node-multi-gpu-validate-run",
  "dep:cugraph-sys",
  "algeon-datafusion/cugraph",
]
# The OTLP cell exercises the public reference exporter from
# `examples`. That package's reference embedding is cugraph-enabled, so
# keep it separate from the feature-off service cell.
single-node-multi-gpu-validate-run-otlp = [
  "single-node-multi-gpu-validate-run-cugraph",
  "dep:examples",
  "dep:opentelemetry",
  "dep:opentelemetry-proto",
]

[dependencies]
arrow = { workspace = true }
arrow-flight = { workspace = true }
cudf = { workspace = true, optional = true }
# Direct (non-transitive) dep so THIS crate's build.rs receives
# DEP_CUDF_RUST_RUNTIME_LIB_DIR from cudf-sys's `links = "cudf_rust"` metadata,
# mirroring the root, bench, engine, and examples rpath bake.
cudf-sys = { workspace = true, optional = true }
cugraph-sys = { workspace = true, optional = true }
cuvs-sys = { workspace = true, optional = true }
cuml-sys = { workspace = true, optional = true }
datafusion = { workspace = true, optional = true }
algeon-datafusion = { workspace = true, optional = true }
bench = { path = "../bench", optional = true }
examples = { path = "../examples", optional = true, features = ["otlp-metrics"] }
workloads = { workspace = true, optional = true }
query-engine = { workspace = true, optional = true }
query-planning = { workspace = true, optional = true }
query-runtime = { workspace = true, optional = true }
futures = { workspace = true }
parquet = { workspace = true, features = ["arrow"] }
opentelemetry = { workspace = true, optional = true }
opentelemetry-proto = { workspace = true, optional = true }
prost = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tonic = { workspace = true }
url = "2.5"

[[bin]]
name = "algeon_tools"
path = "src/bin/algeon_tools.rs"
test = true

[[bin]]
name = "refresh_cugraph_oracle"
path = "src/bin/refresh_cugraph_oracle.rs"
required-features = ["cugraph-oracle"]
test = false

[build-dependencies]
rapids-build-support = { workspace = true }
