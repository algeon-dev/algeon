[package]
name = "algeon-query-planning"
description = "Backend-neutral native query planning, proof, and admission contracts."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/algeon-query-planning"
readme = "../../README.md"
keywords = ["datafusion", "gpu", "cuda", "query-planning", "rapids"]
categories = ["database"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
features = ["cugraph"]

# The package carries the `algeon-` prefix for crates.io; the library identity
# stays bare so `use query_planning::…` and the public API snapshots do not move.
[lib]
name = "query_planning"

[features]
default = []
# cuGraph-owned facts (allocation provenance, resident-cache peaks) are carried
# as planning-defined types, so this flag gates the contract without linking the
# component.
cugraph = []
test-hooks = []

[lints]
workspace = true

[dependencies]
arrow = { workspace = true }
blake3 = { workspace = true }
fnv = { workspace = true }
parquet = { workspace = true, features = ["arrow"] }
serde = { workspace = true }
serde_json = { workspace = true }
