[package]
name = "nexus-tools"
description = "Developer, operator, and explicit E2E tools for datafusion-nexus."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
publish = false
default-run = "nexus_tools"
build = "build.rs"

[lints]
workspace = true

[features]
default = []
validate-query = ["dep:datafusion", "dep:datafusion-nexus"]
datafusion-baseline-contract-validate = [
  "dep:cudf",
  "dep:datafusion",
  "dep:datafusion-nexus",
  "dep:nexus-query-engine",
  "datafusion-nexus/iceberg",
]
clickbench-stage-probe = [
  "dep:cudf",
  "dep:datafusion",
  "dep:datafusion-nexus",
  "dep:nexus-bench",
  "dep:nexus-workloads",
  "dep:nexus-query-engine",
]
cugraph-oracle = ["dep:cudf", "dep:datafusion", "dep:datafusion-nexus", "dep:nexus-query-engine", "datafusion-nexus/cugraph"]
cugraph-similarity-calibrate = ["dep:cudf", "dep:nexus-query-engine", "nexus-query-engine/cugraph"]
iceberg-e2e = [
  "dep:datafusion",
  "dep:datafusion-nexus",
  "dep:iceberg",
  "dep:iceberg-catalog-glue",
  "datafusion-nexus/iceberg",
]
server-iceberg-e2e = ["iceberg-e2e", "datafusion-nexus/server"]
server-runtime-observability-e2e = ["server-iceberg-e2e", "dep:nexus-query-engine"]
embedded-backend-e2e = ["server-iceberg-e2e", "dep:reqwest"]
# The production-validation runner is intentionally opt-in. The base feature
# stays CPU-only so profile parsing, arrival planning, aggregation, and artifact
# writing are unit-testable without CUDA.
single-node-multi-gpu-validate = ["dep:nexus-workloads"]
# P6.5 measured execution on the public backend and attempt API.
single-node-multi-gpu-validate-run = [
  "single-node-multi-gpu-validate",
  "dep:cudf",
  "dep:cudf-sys",
  "dep:cugraph-sys",
  "dep:cuvs-sys",
  "dep:datafusion",
  "dep:datafusion-nexus",
  "dep:nexus-query-engine",
  "datafusion-nexus/cugraph",
  # P6.2's device identity (model name, UUID, physical framebuffer) comes from
  # NVML, and the artifact contract requires recording it.
  "datafusion-nexus/nvml",
]

[dependencies]
arrow = { workspace = true }
arrow-flight = { workspace = true }
cudf = { workspace = true, optional = true }
# Direct (non-transitive) dep so THIS crate's build.rs receives
# DEP_CUDF_RUST_RUNTIME_LIB_DIR from cudf-sys's `links = "cudf_rust"` metadata,
# mirroring the root, bench, engine, and examples rpath bake.
cudf-sys = { workspace = true, optional = true }
cugraph-sys = { workspace = true, optional = true }
cuvs-sys = { workspace = true, optional = true }
datafusion = { workspace = true, optional = true }
datafusion-nexus = { workspace = true, optional = true }
nexus-bench = { path = "../nexus-bench", optional = true }
nexus-workloads = { workspace = true, optional = true }
nexus-query-engine = { workspace = true, optional = true }
futures = { workspace = true }
iceberg = { workspace = true, optional = true }
iceberg-catalog-glue = { workspace = true, optional = true }
parquet = { workspace = true }
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tonic = { workspace = true }
url = "2.5"

[[bin]]
name = "nexus_tools"
path = "src/bin/nexus_tools.rs"
test = true

[[bin]]
name = "refresh_cugraph_oracle"
path = "src/bin/refresh_cugraph_oracle.rs"
required-features = ["cugraph-oracle"]
test = false
