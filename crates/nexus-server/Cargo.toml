[package]
name = "nexus-server"
description = "Flight SQL server for the datafusion-nexus native GPU adapter."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
build = "build.rs"
autotests = false

[features]
default = []
cugraph = ["datafusion-nexus/cugraph", "dep:cugraph-sys", "nexus-query-engine/cugraph"]
cuvs = ["datafusion-nexus/cuvs", "dep:cuvs-sys", "nexus-query-engine/cuvs"]
nvml = ["datafusion-nexus/nvml", "nexus-query-engine/nvml"]
iceberg = [
  "datafusion-nexus/iceberg",
  "dep:nexus-iceberg",
  "nexus-iceberg/all-catalogs",
]

[lints]
workspace = true

[dependencies]
arrow = { workspace = true }
arrow-flight = { workspace = true }
argon2 = "0.5"
async-trait = { workspace = true }
base64 = "0.22"
bytes = { workspace = true }
cudf = { workspace = true }
# Keep this direct edge so build.rs receives cudf-sys runtime metadata.
cudf-sys = { workspace = true }
cugraph-sys = { workspace = true, optional = true }
cuvs-sys = { workspace = true, optional = true }
dashmap = "6.2"
datafusion = { workspace = true }
datafusion-nexus = { workspace = true, default-features = false, features = ["server-internal"] }
futures = { workspace = true }
nexus-iceberg = { workspace = true, optional = true }
nexus-query-engine = { workspace = true }
parquet = { workspace = true }
prost = { workspace = true }
rand = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
toml = "1.1"
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { version = "1.23", features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "datafusion_nexus_server"

[[test]]
name = "server_tests"
path = "tests/server_tests.rs"

[[test]]
name = "server_config_tests"
path = "tests/server_config_tests.rs"

[[test]]
name = "server_iceberg_tests"
path = "tests/server_iceberg_tests.rs"
required-features = ["iceberg"]

[[test]]
name = "server_cugraph_tests"
path = "tests/server_cugraph_tests.rs"
required-features = ["cugraph"]

[[test]]
name = "server_cuvs_tests"
path = "tests/server_cuvs_tests.rs"
required-features = ["cuvs"]
