[package]
name = "nexus-server"
description = "Flight SQL server for the datafusion-nexus native GPU adapter."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nexus-server"
readme = "../../README.md"
keywords = ["datafusion", "flight-sql", "gpu", "cuda", "rapids"]
categories = ["database", "hardware-support"]
build = "build.rs"
autotests = false

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
features = ["cugraph", "cuvs", "nvml"]

[features]
default = []
cugraph = ["datafusion-nexus/cugraph", "dep:cugraph-sys", "nexus-query-engine/cugraph"]
cuvs = ["datafusion-nexus/cuvs", "dep:cuvs-sys", "nexus-query-engine/cuvs"]
nvml = ["datafusion-nexus/nvml", "nexus-query-engine/nvml"]

[lints]
workspace = true

[dependencies]
arrow = { workspace = true }
arrow-flight = { workspace = true }
argon2 = "0.5"
async-trait = { workspace = true }
base64 = "0.22"
bytes = { workspace = true }
cudf = { workspace = true }
# Keep this direct edge so build.rs receives cudf-sys runtime metadata.
cudf-sys = { workspace = true }
cugraph-sys = { workspace = true, optional = true }
cuvs-sys = { workspace = true, optional = true }
dashmap = "6.2"
datafusion = { workspace = true }
datafusion-nexus = { workspace = true, default-features = false, features = ["server-internal"] }
futures = { workspace = true }
nexus-query-engine = { workspace = true }
parquet = { workspace = true }
prost = { workspace = true }
rand = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
toml = "1.1"
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { version = "1.23", features = ["v4"] }

[build-dependencies]
nexus-build-support = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "datafusion_nexus_server"

[[test]]
name = "server_tests_gpu"
path = "tests/server_tests_gpu.rs"

[[test]]
name = "server_admission_concurrency_tests_gpu_exclusive"
path = "tests/server_admission_concurrency_tests_gpu_exclusive.rs"

[[test]]
name = "server_multi_gpu_tests_gpu_exclusive"
path = "tests/server_multi_gpu_tests_gpu_exclusive.rs"

[[test]]
name = "server_config_tests_cpu"
path = "tests/server_config_tests_cpu.rs"

[[test]]
name = "server_cugraph_tests_gpu"
path = "tests/server_cugraph_tests_gpu.rs"
required-features = ["cugraph"]

[[test]]
name = "server_cuvs_tests_gpu"
path = "tests/server_cuvs_tests_gpu.rs"
required-features = ["cuvs"]
