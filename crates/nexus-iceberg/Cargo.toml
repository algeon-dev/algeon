[package]
name = "nexus-iceberg"
description = "DataFusion-free Iceberg catalog, snapshot, and scan-candidate contracts for Nexus."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
publish = false

[features]
default = []
# Base Iceberg table/snapshot resolution. Kept optional so the neutral request,
# candidate, source-access, and error contracts stay cheap to compile in
# isolation.
catalog = ["dep:futures", "dep:iceberg", "dep:serde_json", "dep:tokio", "dep:tokio-util"]
glue = ["catalog", "dep:iceberg-catalog-glue", "dep:iceberg-storage-opendal", "dep:serde", "dep:typetag"]
rest = ["catalog", "dep:iceberg-catalog-rest", "dep:iceberg-storage-opendal"]
all-catalogs = ["glue", "rest"]

[lints]
workspace = true

[dependencies]
arrow = { workspace = true }
futures = { workspace = true, optional = true }
iceberg = { workspace = true, optional = true }
iceberg-catalog-glue = { workspace = true, optional = true }
iceberg-catalog-rest = { workspace = true, optional = true }
iceberg-storage-opendal = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
tokio-util = { workspace = true, optional = true }
typetag = { version = "0.2.21", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
