[package]
name = "datafusion-cudf"
description = "DataFusion physical-plan adapter for native cudf-rs GPU execution."
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
build = "build.rs"

[workspace]
members = [".", "crates/cudf-query-engine"]
default-members = [".", "crates/cudf-query-engine"]
resolver = "3"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[lints]
workspace = true

[workspace.dependencies]
arrow = { version = "58.3.0", default-features = false, features = ["ipc"] }
cudf = { path = "../cudf-rs/cudf-rs" }
cugraph = { path = "../cugraph-rs/cugraph-rs" }
cugraph-sys = { path = "../cugraph-rs/cugraph-sys" }
parquet = "58.3.0"

[features]
default = []
cugraph = ["dep:cugraph", "dep:cugraph-sys", "cudf-query-engine/cugraph"]
iceberg = [
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:iceberg",
    "dep:iceberg-catalog-glue",
    "dep:iceberg-catalog-rest",
    "dep:iceberg-storage-opendal",
    "dep:object_store",
    "dep:tempfile",
]
# CPU Iceberg read path via the upstream iceberg-datafusion integration.
# Opt-in on top of `iceberg`. When this feature is on and the server runs
# under SESSION_PROFILE=cpu_fallback, Iceberg tables are served by
# IcebergStaticTableProvider (real CPU Arrow reader) instead of the
# GPU-only CudfTableFormatScanExec leaf.
iceberg-cpu = ["iceberg", "dep:iceberg-datafusion"]
server = [
    "dep:arrow-flight",
    "dep:argon2",
    "dep:base64",
    "dep:dashmap",
    "dep:prost",
    "dep:rand",
    "dep:serde",
    "dep:toml",
    "dep:tokio-util",
    "dep:tonic",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:uuid",
]
server-cugraph = ["server", "cugraph"]

[dependencies]
arrow = { workspace = true }
argon2 = { version = "0.5", optional = true }
arrow-flight = { version = "58.3", features = ["flight-sql-experimental"], optional = true }
async-trait = "0.1"
base64 = { version = "0.22", optional = true }
aws-config = { version = "1.8", optional = true }
aws-credential-types = { version = "1.2", optional = true }
cudf = { workspace = true }
# Direct (non-transitive) dep on cudf-sys so this crate's build.rs receives
# DEP_CUDF_RUST_RUNTIME_LIB_DIR from cudf-sys's `links = "cudf_rust"`
# metadata. The build script uses it to bake an rpath into every binary so
# the loader picks up the freshly built libcudf_rust.so without relying on
# LD_LIBRARY_PATH ordering.
cudf-sys = { path = "../cudf-rs/cudf-sys" }
cugraph = { workspace = true, optional = true }
# Direct (non-transitive) dep on cugraph-sys so this crate's build.rs receives
# DEP_CUGRAPH_RUNTIME_LIB_DIRS from cugraph-sys's `links = "cugraph"` metadata.
cugraph-sys = { workspace = true, optional = true }
cudf-query-engine = { path = "crates/cudf-query-engine", default-features = false }
dashmap = { version = "6", optional = true }
datafusion = { path = "../datafusion/datafusion/core" }
futures = "0.3"
iceberg = { path = "../iceberg-rust/crates/iceberg", optional = true }
iceberg-catalog-glue = { path = "../iceberg-rust/crates/catalog/glue", optional = true }
iceberg-catalog-rest = { path = "../iceberg-rust/crates/catalog/rest", optional = true }
iceberg-datafusion = { path = "../iceberg-rust/crates/integrations/datafusion", optional = true }
# opendal-s3 is in the crate's default feature set; pulled in for
# OpenDalStorageFactory::S3 which RestCatalog requires (REST has no default
# storage factory, unlike Glue).
iceberg-storage-opendal = { path = "../iceberg-rust/crates/storage/opendal", optional = true }
object_store = { version = "0.13", default-features = false, features = ["aws"], optional = true }
parquet = { workspace = true }
prost = { version = "0.14.1", optional = true }
rand = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
tempfile = { version = "3", optional = true }
toml = { version = "0.8", optional = true }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", optional = true }
tonic = { version = "0.14", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
hex = "0.4"
sha2 = "0.11"
tempfile = "3"

[[bin]]
name = "datafusion_cudf_server"
required-features = ["server"]

[[bin]]
name = "flight_sql_cugraph_smoke"
required-features = ["server"]

[[bin]]
name = "native_iceberg_smoke_report"
required-features = ["iceberg"]

[[bin]]
name = "native_iceberg_tpch_benchmark"
required-features = ["iceberg"]

[[bin]]
name = "query_service_iceberg_stress"
required-features = ["iceberg"]

[[bin]]
name = "query_service_tpcds_stress"

[[bin]]
name = "cugraph_sql_construction_report"
required-features = ["cugraph"]

[[bin]]
name = "refresh_cugraph_oracle"
required-features = ["cugraph"]

[[example]]
name = "iceberg_limit_smoke"
required-features = ["iceberg"]

[[test]]
name = "table_format_iceberg_planner_tests"
required-features = ["iceberg"]

[[test]]
name = "table_format_provider_tests"
required-features = ["iceberg"]

[[test]]
name = "native_iceberg_smoke_report_tests"
required-features = ["iceberg"]

[[test]]
name = "native_iceberg_tpch_benchmark_tests"
required-features = ["iceberg"]

[[test]]
name = "iceberg_public_api_tests"
required-features = ["iceberg"]

[[test]]
name = "iceberg_catalog_provider_tests"
required-features = ["iceberg"]

[[test]]
name = "cugraph_sql_tests"
required-features = ["cugraph"]

[[test]]
name = "cugraph_parity"
required-features = ["cugraph"]

[[test]]
name = "cugraph_bfs_predicate_fixture"
required-features = ["cugraph"]

[[test]]
name = "cugraph_contract"
required-features = ["cugraph"]

[[test]]
name = "server_config_tests"
required-features = ["server"]

[[test]]
name = "server_flight_sql_tests"
required-features = ["server"]

[[test]]
name = "server_auth_tests"
required-features = ["server"]

[[test]]
name = "server_cugraph_dsl_tests"
required-features = ["server", "cugraph"]

[[test]]
name = "server_iceberg_smoke_tests"
required-features = ["server", "iceberg"]

[[test]]
name = "flight_sql_iceberg_native_planning_tests"
required-features = ["server", "iceberg"]

# Patch iceberg-datafusion's `datafusion = "53.1.0"` (declared in the sibling
# iceberg-rust workspace) over to the same path-dep this adapter uses. Without
# this redirect cargo treats the registry copy and the path-dep copy as two
# distinct crate instances, so traits like `TableProvider` are not interchange-
# able between the two and `Arc::new(IcebergStaticTableProvider) as Arc<dyn TableProvider>`
# fails to unify. Patching only the top-level `datafusion` crate is enough
# because all its sub-crates (datafusion-catalog, datafusion-physical-plan,
# ...) are referenced via `workspace = true` inside the sibling datafusion
# workspace, so they automatically inherit the path-dep selection.
[patch.crates-io]
datafusion = { path = "../datafusion/datafusion/core" }
