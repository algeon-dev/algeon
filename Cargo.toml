[package]
name = "datafusion-nexus"
description = "DataFusion physical-plan adapter for native cuDF/cuGraph GPU execution."
version = "0.1.0"
edition = "2024"
rust-version = { workspace = true }
build = "build.rs"

[workspace]
members = [".", "crates/nexus-query-engine", "crates/datafusion-nexus-bench", "crates/datafusion-nexus-tools"]
default-members = [
  ".",
  "crates/nexus-query-engine",
  "crates/datafusion-nexus-bench",
]
resolver = "3"

[workspace.package]
rust-version = "1.94"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[lints]
workspace = true

[workspace.dependencies]
arrow = { version = "58.3.0", default-features = false, features = ["ipc"] }
cudf = { path = "../cudf-rs/cudf-rs" }
cugraph = { path = "../cugraph-rs/cugraph-rs" }
cugraph-sys = { path = "../cugraph-rs/cugraph-sys" }
parquet = { version = "58.3.0", features = ["async", "object_store"] }

[patch."https://github.com/apache/iceberg-rust.git"]
iceberg = { path = "../iceberg-rust/crates/iceberg" }
iceberg-catalog-glue = { path = "../iceberg-rust/crates/catalog/glue" }
iceberg-catalog-rest = { path = "../iceberg-rust/crates/catalog/rest" }
iceberg-datafusion = { path = "../iceberg-rust/crates/integrations/datafusion" }
iceberg-storage-opendal = { path = "../iceberg-rust/crates/storage/opendal" }

[features]
default = []
cugraph = ["dep:cugraph", "dep:cugraph-sys", "nexus-query-engine/cugraph"]
iceberg = [
  "dep:aws-config",
  "dep:aws-credential-types",
  "dep:iceberg",
  "dep:iceberg-catalog-glue",
  "dep:iceberg-catalog-rest",
  "dep:iceberg-storage-opendal",
  "dep:object_store",
  "dep:tempfile",
]
# CPU Iceberg read path via the upstream iceberg-datafusion integration.
# Opt-in on top of `iceberg`. When this feature is on and the server runs
# under SESSION_PROFILE=cpu_fallback, Iceberg tables are served by
# IcebergStaticTableProvider (real CPU Arrow reader) instead of the
# GPU-only CudfTableFormatScanExec leaf.
iceberg-cpu = ["iceberg", "dep:iceberg-datafusion"]
server = [
  "dep:arrow-flight",
  "dep:argon2",
  "dep:base64",
  "dep:dashmap",
  "dep:prost",
  "dep:rand",
  "dep:serde",
  "dep:toml",
  "dep:tokio-util",
  "dep:tonic",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:uuid",
]
server-cugraph = ["server", "cugraph"]

[dependencies]
arrow = { workspace = true }
argon2 = { version = "0.5", optional = true }
arrow-flight = { version = "58.3", features = ["flight-sql-experimental"], optional = true }
async-trait = "0.1"
base64 = { version = "0.22", optional = true }
aws-config = { version = "1.8", optional = true }
aws-credential-types = { version = "1.2", optional = true }
cudf = { workspace = true }
# Direct (non-transitive) dep on cudf-sys so this crate's build.rs receives
# DEP_CUDF_RUST_RUNTIME_LIB_DIR from cudf-sys's `links = "cudf_rust"`
# metadata. The build script uses it to bake a rpath into every binary so
# the loader picks up the freshly built libcudf_rust.so without relying on
# LD_LIBRARY_PATH ordering.
cudf-sys = { path = "../cudf-rs/cudf-sys" }
cugraph = { workspace = true, optional = true }
# Direct (non-transitive) dep on cugraph-sys so this crate's build.rs receives
# DEP_CUGRAPH_RUNTIME_LIB_DIRS from cugraph-sys's `links = "cugraph"` metadata.
cugraph-sys = { workspace = true, optional = true }
nexus-query-engine = { path = "crates/nexus-query-engine", default-features = false }
dashmap = { version = "6.2", optional = true }
datafusion = "53.1"
futures = "0.3"
iceberg = { git = "https://github.com/apache/iceberg-rust.git", rev = "d32c234", optional = true }
iceberg-catalog-glue = {git = "https://github.com/apache/iceberg-rust.git", rev = "d32c234", optional = true }
iceberg-catalog-rest = { git = "https://github.com/apache/iceberg-rust.git", rev = "d32c234", optional = true }
iceberg-datafusion = { git = "https://github.com/apache/iceberg-rust.git", rev = "d32c234", optional = true }
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust.git", rev = "d32c234", optional = true }
object_store = { version = "0.13", default-features = false, features = ["aws"], optional = true }
parquet = { workspace = true }
prost = { version = "0.14", optional = true }
rand = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1.0"
tempfile = { version = "3.27", optional = true }
toml = { version = "1.1", optional = true }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", optional = true }
tonic = { version = "0.14", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
uuid = { version = "1.23", features = ["v4"], optional = true }

[dev-dependencies]
datafusion-nexus-bench = { path = "crates/datafusion-nexus-bench" }
hex = "0.4"
sha2 = "0.11"
tempfile = "3.27"

[[bin]]
name = "datafusion_nexus_server"
required-features = ["server"]

[[test]]
name = "iceberg_tests"
required-features = ["iceberg"]

[[test]]
name = "cugraph_tests"
required-features = ["cugraph"]

[[test]]
name = "server_tests"
required-features = ["server"]

[[test]]
name = "server_iceberg_tests"
required-features = ["server", "iceberg"]

[[test]]
name = "server_cugraph_tests"
required-features = ["server", "cugraph"]
