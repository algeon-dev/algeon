[package]
name = "datafusion-cudf"
description = "DataFusion physical-plan adapter for native cudf-rs GPU execution."
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
build = "build.rs"

[workspace]
members = [".", "crates/cudf-query-engine"]
default-members = [".", "crates/cudf-query-engine"]
resolver = "3"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[lints]
workspace = true

[workspace.dependencies]
arrow = { version = "58.3.0", default-features = false, features = ["ipc"] }
cudf = { path = "../cudf-rs/cudf-rs" }
cugraph = { path = "../cugraph-rs/cugraph-rs" }
cugraph-sys = { path = "../cugraph-rs/cugraph-sys" }
parquet = "58.3.0"

[features]
default = []
cugraph = ["dep:cugraph", "dep:cugraph-sys", "dep:sha2", "cudf-query-engine/cugraph"]
iceberg = [
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:iceberg",
    "dep:iceberg-catalog-glue",
    "dep:object_store",
    "dep:tempfile",
]
server = [
    "dep:arrow-flight",
    "dep:dashmap",
    "dep:prost",
    "dep:tokio-util",
    "dep:tonic",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:uuid",
]

[dependencies]
arrow = { workspace = true }
arrow-flight = { version = "58.3", features = ["flight-sql-experimental"], optional = true }
async-trait = "0.1"
aws-config = { version = "1.8", optional = true }
aws-credential-types = { version = "1.2", optional = true }
cudf = { workspace = true }
# Direct (non-transitive) dep on cudf-sys so this crate's build.rs receives
# DEP_CUDF_RUST_RUNTIME_LIB_DIR from cudf-sys's `links = "cudf_rust"`
# metadata. The build script uses it to bake an rpath into every binary so
# the loader picks up the freshly built libcudf_rust.so without relying on
# LD_LIBRARY_PATH ordering.
cudf-sys = { path = "../cudf-rs/cudf-sys" }
cugraph = { workspace = true, optional = true }
# Direct (non-transitive) dep on cugraph-sys so this crate's build.rs receives
# DEP_CUGRAPH_RUNTIME_LIB_DIRS from cugraph-sys's `links = "cugraph"` metadata.
cugraph-sys = { workspace = true, optional = true }
cudf-query-engine = { path = "crates/cudf-query-engine", default-features = false }
dashmap = { version = "6", optional = true }
datafusion = { path = "../datafusion/datafusion/core" }
futures = "0.3"
iceberg = { path = "../iceberg-rust/crates/iceberg", optional = true }
iceberg-catalog-glue = { path = "../iceberg-rust/crates/catalog/glue", optional = true }
object_store = { version = "0.13", default-features = false, features = ["aws"], optional = true }
parquet = { workspace = true }
prost = { version = "0.14.1", optional = true }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", optional = true }
tonic = { version = "0.14", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[[bin]]
name = "datafusion_cudf_server"
path = "src/bin/datafusion_cudf_server.rs"
required-features = ["server"]

[[bin]]
name = "native_iceberg_smoke_report"
path = "src/bin/native_iceberg_smoke_report.rs"
required-features = ["iceberg"]

[[bin]]
name = "native_iceberg_tpch_benchmark"
path = "src/bin/native_iceberg_tpch_benchmark.rs"
required-features = ["iceberg"]

[[bin]]
name = "cugraph_sql_construction_report"
path = "src/bin/cugraph_sql_construction_report.rs"
required-features = ["cugraph"]

[[bin]]
name = "refresh_cugraph_oracle"
path = "src/bin/refresh_cugraph_oracle.rs"
required-features = ["cugraph"]

[[test]]
name = "table_format_iceberg_planner_tests"
path = "tests/table_format_iceberg_planner_tests.rs"
required-features = ["iceberg"]

[[test]]
name = "table_format_provider_tests"
path = "tests/table_format_provider_tests.rs"
required-features = ["iceberg"]

[[test]]
name = "native_iceberg_smoke_report_tests"
path = "tests/native_iceberg_smoke_report_tests.rs"
required-features = ["iceberg"]

[[test]]
name = "native_iceberg_tpch_benchmark_tests"
path = "tests/native_iceberg_tpch_benchmark_tests.rs"
required-features = ["iceberg"]

[[test]]
name = "iceberg_public_api_tests"
path = "tests/iceberg_public_api_tests.rs"
required-features = ["iceberg"]

[[test]]
name = "iceberg_catalog_provider_tests"
path = "tests/iceberg_catalog_provider_tests.rs"
required-features = ["iceberg"]

[[test]]
name = "cugraph_sql_tests"
path = "tests/cugraph_sql_tests.rs"
required-features = ["cugraph"]

[[test]]
name = "cugraph_parity"
path = "tests/cugraph_parity.rs"
required-features = ["cugraph"]

[[test]]
name = "cugraph_contract"
path = "tests/cugraph_contract.rs"
required-features = ["cugraph"]

[[test]]
name = "server_config_tests"
path = "tests/server_config_tests.rs"
required-features = ["server"]

[[test]]
name = "server_flight_sql_tests"
path = "tests/server_flight_sql_tests.rs"
required-features = ["server"]

[[test]]
name = "server_iceberg_smoke_tests"
path = "tests/server_iceberg_smoke_tests.rs"
required-features = ["server", "iceberg"]
