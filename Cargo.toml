[workspace]
members = [
  "crates/algeon-datafusion",
  "crates/workloads",
  "crates/algeon-query-engine",
  "crates/algeon-query-planning",
  "crates/algeon-query-runtime",
  "crates/algeon-server",
  "crates/bench",
  "crates/tools",
  "crates/examples",
  "scripts/ci/fixtures/datafusion-facade-consumer",
  "components/cudf/algeon-cudf",
  "components/cudf/algeon-cudf-sys",
  "components/algeon-build-support",
  "components/algeon-interop",
  "components/cugraph/algeon-cugraph",
  "components/cugraph/algeon-cugraph-sys",
  "components/cuvs/algeon-cuvs",
  "components/cuvs/algeon-cuvs-sys",
  "components/cuml/algeon-cuml",
  "components/cuml/algeon-cuml-sys",
]
default-members = [
  "crates/algeon-datafusion",
  "crates/workloads",
  "crates/algeon-query-engine",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/algeon-dev/algeon"
homepage = "https://algeon.dev"

# Preserve file/line diagnostics while reducing dev/test artifact size and link time.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
absolute_paths = "warn"
allow_attributes = "warn"
clone_on_ref_ptr = "warn"
coerce_container_to_any = "warn"
debug_assert_with_mut_call = "warn"
default_union_representation = "warn"
explicit_into_iter_loop = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_frames = "warn"
path_buf_push_overwrite = "warn"
precedence_bits = "warn"
redundant_clone = "warn"
suspicious_xor_used_as_pow = "warn"
trailing_empty_array = "warn"
uninhabited_references = "warn"

drop_non_drop = "deny"

[workspace.dependencies]
# Published crate names carry the `algeon-` prefix because the bare RAPIDS
# names are taken on crates.io: `cudf`/`cudf-sys` by a third party, and
# `cuvs`/`cuvs-sys` by NVIDIA's own rapidsai/cuvs. The alias key stays bare so
# Rust imports remain `use cudf::…` and `dep:` feature strings keep resolving.
algeon-datafusion = { path = "crates/algeon-datafusion", version = "=0.1.0", default-features = false }
workloads = { path = "crates/workloads" }
query-engine = { package = "algeon-query-engine", path = "crates/algeon-query-engine", version = "=0.1.0", default-features = false }
query-planning = { package = "algeon-query-planning", path = "crates/algeon-query-planning", version = "=0.1.0", default-features = false }
query-runtime = { package = "algeon-query-runtime", path = "crates/algeon-query-runtime", version = "=0.1.0", default-features = false }
cudf = { package = "algeon-cudf", path = "components/cudf/algeon-cudf", version = "=0.1.0" }
cudf-sys = { package = "algeon-cudf-sys", path = "components/cudf/algeon-cudf-sys", version = "=0.1.0" }
cugraph = { package = "algeon-cugraph", path = "components/cugraph/algeon-cugraph", version = "=0.1.0" }
cugraph-sys = { package = "algeon-cugraph-sys", path = "components/cugraph/algeon-cugraph-sys", version = "=0.1.0" }
cuvs = { package = "algeon-cuvs", path = "components/cuvs/algeon-cuvs", version = "=0.1.0" }
cuvs-sys = { package = "algeon-cuvs-sys", path = "components/cuvs/algeon-cuvs-sys", version = "=0.1.0" }
cuml = { package = "algeon-cuml", path = "components/cuml/algeon-cuml", version = "=0.1.0" }
cuml-sys = { package = "algeon-cuml-sys", path = "components/cuml/algeon-cuml-sys", version = "=0.1.0" }
rapids-build-support = { package = "algeon-build-support", path = "components/algeon-build-support", version = "=0.1.0" }
rapids-interop = { package = "algeon-interop", path = "components/algeon-interop", version = "=0.1.0" }
ahash = "0.8"
anyhow = "1"
arrow = { version = "59.3", default-features = false, features = ["ipc"] }
arrow-flight = { version = "59.3", features = ["flight-sql-experimental"] }
arrow-json = "59.3"
async-trait = "0.1"
axum = "0.8"
blake3 = "1.8"
bitflags = "2"
bytes = "1"
cc = "1.2"
cmake = "0.1"
cmake-package = "0.2.0"
datafusion = "55.1"
fnv = "1"
futures = "0.3"
getrandom = "0.4"
indexmap = "2"
libc = "0.2"
object_store = { version = "0.13", default-features = false, features = ["aws"] }
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics"] }
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic-messages", "metrics", "gen-tonic"] }
parquet = { version = "59.3", default-features = false, features = ["async", "object_store"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
smallvec = "1.15"
static_assertions = "1"
tempfile = "3.27"
tokio = "1.52"
tokio-util = "0.7"
tonic = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
typed-builder = "0.23"
