[package]
name = "datafusion-nexus"
autotests = false
description = "DataFusion physical-plan adapter for native GPU execution."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
build = "build.rs"
repository = "https://github.com/DataFusion-Nexus/datafusion-nexus"
homepage = "https://datafusion.nexus"
license = "Apache-2.0"
documentation = "https://docs.rs/datafusion_nexus"
keywords = ["sql", "datafusion", "gpu", "cuda", "iceberg"]
categories = ["database", "hardware-support"]
readme = "README.md"

[workspace]
members = [
  ".",
  "crates/nexus-workloads",
  "crates/nexus-iceberg",
  "crates/nexus-query-engine",
  "crates/nexus-query-planning",
  "crates/nexus-query-runtime",
  "crates/nexus-server",
  "crates/nexus-bench",
  "crates/nexus-tools",
  "crates/nexus-examples",
  "scripts/ci/fixtures/datafusion-facade-consumer",
  "components/cudf/cudf-nexus",
  "components/cudf/cudf-nexus-sys",
  "components/cudf/rapids-interop",
  "components/cugraph/cugraph-nexus",
  "components/cugraph/cugraph-nexus-sys",
  "components/cuvs/cuvs-nexus",
  "components/cuvs/cuvs-nexus-sys",
]
default-members = [
  ".",
  "crates/nexus-workloads",
  "crates/nexus-query-engine",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/DataFusion-Nexus/datafusion-nexus"
homepage = "https://datafusion.nexus"

# Preserve file/line diagnostics while reducing dev/test artifact size and link time.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
allow_attributes = "warn"
coerce_container_to_any = "warn"
debug_assert_with_mut_call = "warn"
default_union_representation = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_frames = "warn"
path_buf_push_overwrite = "warn"
precedence_bits = "warn"
suspicious_xor_used_as_pow = "warn"
trailing_empty_array = "warn"
uninhabited_references = "warn"

drop_non_drop = "deny"

[lints]
workspace = true

[workspace.dependencies]
datafusion-nexus = { path = ".", version = "=0.1.0", default-features = false }
nexus-workloads = { path = "crates/nexus-workloads" }
nexus-query-engine = { path = "crates/nexus-query-engine", version = "=0.1.0", default-features = false }
nexus-query-planning = { path = "crates/nexus-query-planning", version = "=0.1.0", default-features = false }
nexus-query-runtime = { path = "crates/nexus-query-runtime", version = "=0.1.0", default-features = false }
nexus-server = { path = "crates/nexus-server", default-features = false }
nexus-iceberg = { path = "crates/nexus-iceberg", version = "=0.1.0", default-features = false }
cudf = { package = "cudf-nexus", path = "components/cudf/cudf-nexus", version = "=0.1.0" }
cudf-sys = { package = "cudf-nexus-sys", path = "components/cudf/cudf-nexus-sys", version = "=0.1.0" }
cugraph = { package = "cugraph-nexus", path = "components/cugraph/cugraph-nexus", version = "=0.1.0" }
cugraph-sys = { package = "cugraph-nexus-sys", path = "components/cugraph/cugraph-nexus-sys", version = "=0.1.0" }
cuvs = { package = "cuvs-nexus", path = "components/cuvs/cuvs-nexus", version = "=0.1.0" }
cuvs-sys = { package = "cuvs-nexus-sys", path = "components/cuvs/cuvs-nexus-sys", version = "=0.1.0" }
rapids-interop = { path = "components/cudf/rapids-interop", version = "=0.1.0" }
ahash = "0.8"
anyhow = "1"
arrow = { version = "59.2", default-features = false, features = ["ipc"] }
arrow-flight = { version = "59.2", features = ["flight-sql-experimental"] }
arrow-json = "59.2"
async-trait = "0.1"
aws-config = "1.10"
aws-credential-types = "1.3"
axum = "0.8"
blake3 = "1.8"
bindgen = "0.72"
bitflags = "2"
bytes = "1"
cc = "1.2"
cmake = "0.1"
cmake-package = "0.2.0"
csv = "1.4"
datafusion = "55.0"
fnv = "1"
futures = "0.3"
getrandom = "0.4"
iceberg = { git = "https://github.com/apache/iceberg-rust.git", rev = "16badac3543ae99f90e9d0e65f56068eef3751d0" }
iceberg-catalog-glue = { git = "https://github.com/apache/iceberg-rust.git", rev = "16badac3543ae99f90e9d0e65f56068eef3751d0" }
iceberg-catalog-rest = { git = "https://github.com/apache/iceberg-rust.git", rev = "16badac3543ae99f90e9d0e65f56068eef3751d0" }
iceberg-datafusion = { git = "https://github.com/apache/iceberg-rust.git", rev = "16badac3543ae99f90e9d0e65f56068eef3751d0" }
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust.git", rev = "16badac3543ae99f90e9d0e65f56068eef3751d0" }
indexmap = "2"
object_store = { version = "0.13", default-features = false, features = ["aws"] }
opendal = "0.58"
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics"] }
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic-messages", "metrics", "gen-tonic"] }
parquet = { version = "59.2", default-features = false, features = ["async", "object_store"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
smallvec = "1.15"
static_assertions = "1"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.27"
tokio = "1.52"
tokio-util = "0.7"
tonic = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
typed-builder = "0.23"

[features]
default = []
test-support = ["nexus-query-engine/test-hooks"]
# Workspace-internal bridge for the companion Flight SQL frontend.
server-internal = []
# Application/test support surface; not part of the normal embedded/server report contract.
bench-support = []
cugraph = ["dep:cugraph", "dep:cugraph-sys", "nexus-query-engine/cugraph"]
cuvs = ["dep:cuvs", "dep:cuvs-sys", "nexus-query-engine/cuvs"]
# Optional live NVML diagnostics; admission capacity and SM count remain on cudf CUDA/RMM inventory.
nvml = ["nexus-query-engine/nvml"]
iceberg = [
  "dep:nexus-iceberg",
  "dep:iceberg",
  "dep:iceberg-datafusion",
  "dep:object_store",
  "dep:opendal",
  "dep:tempfile",
  "nexus-iceberg/all-catalogs",
]

[dependencies]
arrow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
cudf = { workspace = true }
# Direct sys edges expose authoritative native library paths to build.rs.
cudf-sys = { workspace = true }
cugraph = { workspace = true, optional = true }
cugraph-sys = { workspace = true, optional = true }
cuvs = { workspace = true, optional = true }
cuvs-sys = { workspace = true, optional = true }
nexus-query-engine = { workspace = true }
datafusion = { workspace = true }
nexus-iceberg = { workspace = true, optional = true }
fnv = { workspace = true }
futures = { workspace = true }
iceberg = { workspace = true, optional = true }
iceberg-datafusion = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
opendal = { workspace = true, optional = true }
parquet = { workspace = true, default-features = true }
serde_json = { workspace = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
nexus-workloads = { workspace = true }
hex = "0.4"
proptest = "1.7"
sha2 = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "iceberg_tests"
required-features = ["iceberg"]

[[test]]
name = "cugraph_tests"
required-features = ["cugraph"]

[[test]]
name = "root_gpu_tests"

[[test]]
name = "p6_device_identity_tests"
required-features = ["nvml"]

[[test]]
name = "cpu_contract_tests"

[[test]]
name = "native_exec_tests"

[[test]]
name = "native_planning_tests"

[[test]]
name = "native_runtime_pruning_tests"

[[test]]
name = "native_tpcds_parity_tests"
required-features = ["bench-support"]

[[test]]
name = "rapids_build_support_tests"
