[package]
name = "datafusion-nexus"
description = "DataFusion physical-plan adapter for native GPU execution."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
build = "build.rs"
repository = "https://github.com/DataFusion-Nexus/datafusion-nexus"
homepage = "https://datafusion.nexus"
readme = "README.md"

[workspace]
members = [
  ".",
  "crates/datafusion-nexus-workloads",
  "crates/datafusion-nexus-iceberg",
  "crates/nexus-query-engine",
  "crates/datafusion-nexus-bench",
  "crates/datafusion-nexus-tools",
  "crates/datafusion-nexus-examples",
]
default-members = [
  ".",
  "crates/datafusion-nexus-workloads",
  "crates/nexus-query-engine",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
rust-version = "1.94"

# Line tables only. Full debuginfo left every integration harness near 2 GiB and
# dominated link time on the local edit loop; file:line failure diagnostics remain
# with debug = 1. Do not combine this with other profile experiments in the same
# measurement (see docs/plan/2026-07-22-test-build-feedback-loop-plan.md).
[profile.test]
debug = 1

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[lints]
workspace = true

[workspace.dependencies]
datafusion-nexus = { path = ".", default-features = false }
datafusion-nexus-workloads = { path = "crates/datafusion-nexus-workloads" }
nexus-query-engine = { path = "crates/nexus-query-engine", default-features = false }
cudf = { path = "../cudf-rs/cudf-rs" }
cudf-sys = { path = "../cudf-rs/cudf-sys" }
cugraph = { path = "../cugraph-rs/cugraph-rs" }
cugraph-sys = { path = "../cugraph-rs/cugraph-sys" }
anyhow = "1"
arrow = { version = "58.3.0", default-features = false, features = ["ipc"] }
arrow-flight = { version = "58.3.0", features = ["flight-sql-experimental"] }
arrow-json = "58.3.0"
aws-config = "1.10"
aws-credential-types = "1.3"
axum = "0.8"
blake3 = "1.8"
datafusion = "54"
futures = "0.3"
getrandom = "0.4"
iceberg = { git = "https://github.com/apache/iceberg-rust.git", branch = "main" }
iceberg-catalog-glue = { git = "https://github.com/apache/iceberg-rust.git", branch = "main" }
iceberg-catalog-rest = { git = "https://github.com/apache/iceberg-rust.git", branch = "main" }
iceberg-datafusion = { git = "https://github.com/apache/iceberg-rust.git", branch = "main" }
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust.git", branch = "main" }
object_store = { version = "0.13", default-features = false, features = ["aws"] }
opendal = "0.57"
parquet = { version = "58.3", features = ["async", "object_store"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
tokio = { version = "1.52" }
tokio-util = "0.7"
tonic = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = []
cugraph = ["dep:cugraph", "dep:cugraph-sys", "nexus-query-engine/cugraph"]
# Optional live NVML diagnostics; admission capacity and SM count remain on cudf-rs CUDA/RMM inventory.
nvml = ["nexus-query-engine/nvml"]
iceberg = [
  "dep:datafusion-nexus-iceberg",
  "dep:iceberg",
  "dep:iceberg-datafusion",
  "dep:object_store",
  "dep:opendal",
  "dep:tempfile",
  "datafusion-nexus-iceberg/all-catalogs",
]
server = [
  "dep:arrow-flight",
  "dep:argon2",
  "dep:base64",
  "dep:dashmap",
  "dep:prost",
  "dep:rand",
  "dep:serde",
  "dep:toml",
  "dep:tokio-util",
  "dep:tonic",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:uuid",
]
server-cugraph = ["server", "cugraph"]

[dependencies]
arrow = { workspace = true }
argon2 = { version = "0.5", optional = true }
arrow-flight = { workspace = true, optional = true }
async-trait = "0.1"
base64 = { version = "0.22", optional = true }
bytes = "1"
cudf = { workspace = true }
# Direct (non-transitive) dep on cudf-sys so this crate's build.rs receives
# DEP_CUDF_RUST_RUNTIME_LIB_DIR from cudf-sys's `links = "cudf_rust"`
# metadata. The build script uses it to bake a rpath into every binary so
# the loader picks up the freshly built libcudf_rust.so without relying on
# LD_LIBRARY_PATH ordering.
cudf-sys = { workspace = true }
cugraph = { workspace = true, optional = true }
# Direct (non-transitive) dep on cugraph-sys so this crate's build.rs receives
# DEP_CUGRAPH_RUNTIME_LIB_DIRS from cugraph-sys's `links = "cugraph"` metadata.
cugraph-sys = { workspace = true, optional = true }
nexus-query-engine = { workspace = true }
dashmap = { version = "6.2", optional = true }
datafusion = { workspace = true }
datafusion-nexus-iceberg = { path = "crates/datafusion-nexus-iceberg", optional = true, default-features = false }
futures = { workspace = true }
iceberg = { workspace = true, optional = true }
iceberg-datafusion = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
opendal = { workspace = true, optional = true }
parquet = { workspace = true }
prost = { version = "0.14", optional = true }
rand = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { workspace = true }
tempfile = { workspace = true, optional = true }
toml = { version = "1.1", optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", optional = true }
tonic = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
uuid = { version = "1.23", features = ["v4"], optional = true }

[dev-dependencies]
datafusion-nexus-workloads = { workspace = true }
hex = "0.4"
sha2 = "0.11"
tempfile = { workspace = true }

[[bin]]
name = "datafusion_nexus_server"
required-features = ["server"]

[[test]]
name = "iceberg_tests"
required-features = ["iceberg"]

[[test]]
name = "cugraph_tests"
required-features = ["cugraph"]

[[test]]
name = "server_tests"
required-features = ["server"]

[[test]]
name = "server_config_tests"
required-features = ["server"]

[[test]]
name = "server_iceberg_tests"
required-features = ["server", "iceberg"]

[[test]]
name = "server_cugraph_tests"
required-features = ["server", "cugraph"]
