[package]
name = "datafusion-nexus"
autotests = false
description = "DataFusion physical-plan adapter for native GPU execution."
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }
build = "build.rs"
repository = "https://github.com/DataFusion-Nexus/datafusion-nexus"
homepage = "https://datafusion.nexus"
readme = "README.md"

[workspace]
members = [
  ".",
  "crates/nexus-workloads",
  "crates/nexus-iceberg",
  "crates/nexus-query-engine",
  "crates/nexus-server",
  "crates/nexus-bench",
  "crates/nexus-tools",
  "crates/nexus-examples",
]
default-members = [
  ".",
  "crates/nexus-workloads",
  "crates/nexus-query-engine",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
rust-version = "1.94"

# The `test` profile only covers test TARGET crates; every dependency
# (workspace libs such as nexus-query-engine, and third-party crates such as
# datafusion and tokio) is always compiled under `[profile.dev]`, `[profile.test]`
# settings never reach them. Full debuginfo (`debug = 2`) on `dev` left every
# rlib and integration-test binary near or above 1-2 GiB and dominated link
# time on the local edit loop. Line-tables-only keeps `file:line` in panics
# and backtraces while dropping the variable/type debug records that make up
# most of the bytes; unpacked split-debuginfo keeps what remains out of the
# rlib/binary itself. `[profile.test]` is intentionally absent so it inherits
# these settings from `dev` rather than diverging again.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# [workspace.lints.clippy]
# pedantic = { level = "warn", priority = -1 }
# unwrap_used = "warn"
# expect_used = "warn"
# panic = "warn"
# todo = "warn"
# unimplemented = "warn"
# dbg_macro = "warn"
# print_stdout = "warn"
# print_stderr = "warn"
# std_instead_of_core = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
drop_non_drop = "deny"

[lints]
workspace = true

[workspace.dependencies]
datafusion-nexus = { path = ".", default-features = false }
nexus-workloads = { path = "crates/nexus-workloads" }
nexus-query-engine = { path = "crates/nexus-query-engine", default-features = false }
nexus-server = { path = "crates/nexus-server", default-features = false }
cudf = { package = "cudf-nexus", path = "../cudf-nexus/cudf-nexus" }
cudf-sys = { package = "cudf-nexus-sys", path = "../cudf-nexus/cudf-nexus-sys" }
cugraph = { package = "cugraph-nexus", path = "../cugraph-nexus/cugraph-nexus" }
cugraph-sys = { package = "cugraph-nexus-sys", path = "../cugraph-nexus/cugraph-nexus-sys" }
cuvs = { package = "cuvs-nexus", path = "../cuvs-nexus/cuvs-nexus" }
cuvs-sys = { package = "cuvs-nexus-sys", path = "../cuvs-nexus/cuvs-nexus-sys" }
anyhow = "1"
arrow = { version = "58.3.0", default-features = false, features = ["ipc"] }
arrow-flight = { version = "58.3.0", features = ["flight-sql-experimental"] }
arrow-json = "58.3.0"
async-trait = "0.1"
aws-config = "1.10"
aws-credential-types = "1.3"
axum = "0.8"
blake3 = "1.8"
bytes = "1"
datafusion = "54.1"
futures = "0.3"
getrandom = "0.4"
iceberg = { git = "https://github.com/apache/iceberg-rust.git", branch = "main" }
iceberg-catalog-glue = { git = "https://github.com/apache/iceberg-rust.git", branch = "main" }
iceberg-catalog-rest = { git = "https://github.com/apache/iceberg-rust.git", branch = "main" }
iceberg-datafusion = { git = "https://github.com/apache/iceberg-rust.git", branch = "main" }
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust.git", branch = "main" }
object_store = { version = "0.13", default-features = false, features = ["aws"] }
opendal = "0.57"
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics"] }
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic-messages", "metrics", "gen-tonic"] }
parquet = { version = "58.3.0", features = ["async", "object_store"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
tokio = { version = "1.52" }
tokio-util = "0.7"
tonic = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = []
cugraph = ["dep:cugraph", "dep:cugraph-sys", "nexus-query-engine/cugraph"]
cuvs = ["dep:cuvs", "dep:cuvs-sys", "nexus-query-engine/cuvs"]
# Optional live NVML diagnostics; admission capacity and SM count remain on cudf CUDA/RMM inventory.
nvml = ["nexus-query-engine/nvml"]
iceberg = [
  "dep:nexus-iceberg",
  "dep:iceberg",
  "dep:iceberg-datafusion",
  "dep:object_store",
  "dep:opendal",
  "dep:tempfile",
  "nexus-iceberg/all-catalogs",
]

[dependencies]
arrow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
cudf = { workspace = true }
# Direct (non-transitive) dep on cudf-sys so this crate's build.rs receives
# DEP_CUDF_RUST_RUNTIME_LIB_DIR from cudf-sys's `links = "cudf_rust"`
# metadata. The build script uses it to bake a rpath into every binary so
# the loader picks up the freshly built libcudf_rust.so without relying on
# LD_LIBRARY_PATH ordering.
cudf-sys = { workspace = true }
cugraph = { workspace = true, optional = true }
# Direct (non-transitive) dep on cugraph-sys so this crate's build.rs receives
# DEP_CUGRAPH_RUNTIME_LIB_DIRS from cugraph-sys's `links = "cugraph"` metadata.
cugraph-sys = { workspace = true, optional = true }
cuvs = { workspace = true, optional = true }
# Direct edge so build.rs receives the authoritative libcuvs/libcuvs_c paths
# exported through cuvs-sys's `links = "cuvs_c"` metadata.
cuvs-sys = { workspace = true, optional = true }
nexus-query-engine = { workspace = true }
datafusion = { workspace = true }
nexus-iceberg = { path = "crates/nexus-iceberg", optional = true, default-features = false }
futures = { workspace = true }
iceberg = { workspace = true, optional = true }
iceberg-datafusion = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
opendal = { workspace = true, optional = true }
parquet = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
nexus-workloads = { workspace = true }
hex = "0.4"
proptest = "1.7"
sha2 = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "iceberg_tests"
path = "tests/iceberg_tests.rs"
required-features = ["iceberg"]

[[test]]
name = "cugraph_tests"
path = "tests/cugraph_tests.rs"
required-features = ["cugraph"]

[[test]]
name = "root_gpu_tests"
path = "tests/root_gpu_tests.rs"

[[test]]
name = "p6_device_identity_tests"
path = "tests/p6_device_identity_tests.rs"
required-features = ["nvml"]

[[test]]
name = "cpu_contract_tests"
path = "tests/cpu_contract_tests.rs"

[[test]]
name = "native_exec_tests"
path = "tests/native_exec_tests.rs"

[[test]]
name = "native_planning_tests"
path = "tests/native_planning_tests.rs"

[[test]]
name = "native_runtime_pruning_tests"
path = "tests/native_runtime_pruning_tests.rs"

[[test]]
name = "native_tpcds_parity_tests"
path = "tests/native_tpcds_parity_tests.rs"

[[test]]
name = "rapids_build_support_tests"
path = "tests/rapids_build_support_tests.rs"
